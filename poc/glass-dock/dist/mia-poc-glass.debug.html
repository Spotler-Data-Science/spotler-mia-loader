    get: function (k) { try { return s ? s.getItem(k) : null; } catch (e) { return null; } },

/* ---- 20-config.js ---- */
/* ==================================================================
   20 · Page config: load config.json, pick the row for this page
   - The live file wins when it arrives within CONFIG_WAIT_MS, so a
     published change shows on the next page load (GitHub's copy, ~5 min
     after a commit; jsDelivr only as backup). The URL carries a
     5-minute stamp so the browser's HTTP cache can't serve an old copy.
   - Slow or failed fetch: the cached copy (returning visitors) or the
     built-in DEFAULT_ROWS (first visit). A late response is cached and
     handed over too: the page swaps in its teaser and opener if the
     visitor hasn't started chatting yet.
   - A cached copy that switches the region off never decides alone:
     the live one is awaited.
   ================================================================== */
var CONFIG_CACHE_KEY = "spotler_mia_config";

function fetchConfig(cb) {
  var urls = SETTINGS.CONFIG_URLS, stamp = "?t=" + Math.floor(now() / 300000);
  (function attempt(i) {
    if (i >= urls.length) { cb(null); return; }
    var done = false, xhr;
    function fail(why) {
      if (done) return; done = true;
      log("config fetch failed (" + urls[i].split("/")[2] + "): " + why);
      attempt(i + 1);
    }
    try {
      xhr = new XMLHttpRequest();
      xhr.open("GET", urls[i] + stamp, true);
      xhr.timeout = 5000;
      xhr.onload = function () {
        if (done) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try { var cfg = validateConfig(JSON.parse(xhr.responseText)); done = true; cb(cfg); return; }
          catch (e) { fail("bad file (" + e.message + ")"); return; }
        }
        fail("HTTP " + xhr.status);
      };
      xhr.onerror = function () { fail("network or blocked (CSP?)"); };
      xhr.ontimeout = function () { fail("timeout"); };
      xhr.send();
    } catch (e) { fail(String(e)); }
  })(0);
}

// Defensive: never trust the file's shape. Bad rows are dropped, not fatal.
function validateConfig(cfg) {
  if (!cfg || typeof cfg !== "object" || !cfg.rows || !cfg.rows.length) throw new Error("no rows");
  var rows = [];
  for (var i = 0; i < cfg.rows.length; i++) {
    var r = cfg.rows[i];
    if (!r || typeof r.url_match !== "string" || typeof r.region !== "string") continue;
    rows.push({
      url_match: trim(r.url_match).toLowerCase(),
      match_type: (r.match_type === "exact" || r.match_type === "contains") ? r.match_type : "prefix",
      region: r.region,
      mode: (r.mode === "half" || r.mode === "full") ? r.mode : "slideout",
      page: typeof r.page === "string" ? r.page : "",
      // Campaign id (mailplus, feedbackpro…) for the bot's campaign profile.
      // The old `route` column (Studio routes B/C) is no longer read.
      campaign: typeof r.campaign === "string" ? trim(r.campaign).toLowerCase().slice(0, 60) : "",
      opener: typeof r.opener === "string" ? r.opener.slice(0, 1200) : "",
      buttons: (r.buttons || []).filter(function (b) { return b && trim(b.label); }).slice(0, 6).map(function (b) {
        return { label: trim(b.label).slice(0, 80), send: trim(b.send || b.label).slice(0, 300) };
      }),
      teaser_text: typeof r.teaser_text === "string" ? r.teaser_text.slice(0, 200) : "",
      teaser_send: typeof r.teaser_send === "string" ? r.teaser_send.slice(0, 300) : "",
      headline: typeof r.headline === "string" ? r.headline.slice(0, 200) : "",
      intro: typeof r.intro === "string" ? r.intro.slice(0, 400) : "",
      media_selector: typeof r.media_selector === "string" ? r.media_selector.slice(0, 300) : ""
    });
  }
  if (!rows.length) throw new Error("no valid rows");
  return {
    version: String(cfg.version || ""),
    enabledRegions: (cfg.enabledRegions && cfg.enabledRegions.length) ? cfg.enabledRegions : null,
    rows: rows
  };
}

function loadConfig(cb) {
  var cached = LS.getJSON(CONFIG_CACHE_KEY);
  if (!(cached && cached.rows)) cached = null;
  var answered = false;
  // cb returns false to turn down a cached answer (it would switch the
  // region off); the network copy then decides.
  var usedVersion = null;
  function answer(cfg, source) {
    if (answered) return;
    log("config from " + source + (cfg && cfg.version ? " v" + cfg.version : ""));
    answered = cb(cfg, source) !== false;
    if (answered) usedVersion = cfg ? cfg.version : "";
  }

  fetchConfig(function (fresh) {
    if (fresh) {
      if (Consent.ok() && (!cached || cached.version !== fresh.version)) LS.setJSON(CONFIG_CACHE_KEY, fresh);
      // Slow network: the page already started on an older copy (or the
      // built-in default). Hand over the live one so the page can catch up.
      if (answered && usedVersion !== fresh.version) {
        log("config from late network v" + fresh.version + " (was " + (usedVersion || "built-in") + ")");
        cb(fresh, "late");
        return;
      }
      answer(fresh, "network");
    } else {
      if (cached) answer(cached, "cache");
      answer(null, "built-in default (fetch failed)");
    }
  });

  setTimeout(function () {
    if (cached) answer(cached, "cache");            // network slow: last known copy
    else answer(null, "built-in default (slow)");
  }, SETTINGS.CONFIG_WAIT_MS);
}

function normalisePath(p) {
  p = String(p || "/").toLowerCase().split("?")[0].split("#")[0];
  if (p.length > 1) p = p.replace(/\/+$/, "");
  return p || "/";
}

// Most specific match wins: exact > longest prefix > "*".
function matchRow(rows, path, regionId) {
  path = normalisePath(path);
  var best = null, bestScore = -1;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.region !== regionId) continue;
    var m = r.url_match === "*" ? "*" : normalisePath(r.url_match);
    var score = -1;
    if (m === "*") score = 0;
    else if (r.match_type === "exact") { if (path === m) score = 100000 + m.length; }
    else if (r.match_type === "contains") { if (path.indexOf(String(r.url_match).toLowerCase()) !== -1) score = r.url_match.length; }
    else if (path === m || path.indexOf(m + "/") === 0) score = m.length;
    if (score > bestScore) { best = r; bestScore = score; }
  }
  return best;
}

function rowsFor(cfg) {
  return (cfg && cfg.rows) ? cfg.rows : SETTINGS.DEFAULT_ROWS;
}

// A page row only needs the columns it changes: anything left blank
// comes from that region's "*" row, then from the built-in default.
function pickRow(cfg, path, regionId) {
  var rows = rowsFor(cfg);
  var row = matchRow(rows, path, regionId);
  var base = matchRow(rows, "/__no_page__", regionId);
  var builtIn = matchRow(SETTINGS.DEFAULT_ROWS, "/__no_page__", regionId);
  var out = {};
  [builtIn, base, row].forEach(function (r) {
    if (!r) return;
    for (var k in r) {
      if (!r.hasOwnProperty(k)) continue;
      var v = r[k];
      if (k === "buttons") {
        // No buttons on a row = inherit, unless that row sets its own opener.
        if (v && v.length) out.buttons = v;
        else if (r === row && r.opener) out.buttons = [];
        continue;
      }
      if (v == null || v === "") continue;
      out[k] = v;
    }
  });
  return out;
}

/* ---- 30-state.js ---- */
/* ==================================================================
   30 · Conversation state
   One live conversation per visitor, shared by all tabs (Botpress keeps
   its conversation id in localStorage too). A conversation is "live"
   from the visitor's first message until TIMEOUT_MS without activity,
   a Restart, or a region change. Ending it clears ONLY the Botpress
   conversation id (the Botpress user is kept) and our own chat keys.
   ================================================================== */
var LIVE_KEY = "spotler_mia_live";      // {region, startedAt, lastActivity, startPage}
var PANEL_STATE_KEY = "spotlerAgentState"; // 'open' | 'dismissed' (same key as the old tags)
var TEASED_KEY = "spotlerTeaserPages";

/* ---- consent (Cookiebot) ----
   Before a chat starts the tag only keeps convenience state: the saved
   page table, panel open/closed, pages already teased. With Cookiebot on
   the page that needs "preferences" consent; without it the state lives
   in memory for this page only. Starting a chat is the visitor asking for
   the service, so from then on the chat's own state is kept. */
var Consent = {
  ok: function () {
    var cb = window.Cookiebot;
    if (cb && cb.consent) return !!cb.consent.preferences;
    var m = /(?:^|;\s*)CookieConsent=([^;]*)/.exec(document.cookie || "");
    if (m) return /preferences:true/.test(decodeURIComponent(m[1]));
    return true;                      // no consent tool on this page
  },
  chatting: function () { return !!(LS.get(LIVE_KEY) || (typeof BP !== "undefined" && BP.engaged)); },
  // Consent refused (or withdrawn): drop what was kept before it was known.
  purge: function () {
    if (Consent.ok()) return;
    LS.del(CONFIG_CACHE_KEY);
    SS.del(TEASED_KEY);
    if (!Consent.chatting()) SS.del(PANEL_STATE_KEY);
    log("no preferences consent: pre-chat storage cleared");
  }
};
["CookiebotOnDecline", "CookiebotOnConsentReady", "CookiebotOnAccept"].forEach(function (ev) {
  window.addEventListener(ev, function () { Consent.purge(); });
});

// Pre-chat session state: sessionStorage with consent (or once chatting), else memory.
var PS = (function () {
  var mem = {};
  function stored() { return Consent.ok() || Consent.chatting(); }
  return {
    get: function (k) { return stored() ? SS.get(k) : (mem.hasOwnProperty(k) ? mem[k] : null); },
    set: function (k, v) { if (stored()) SS.set(k, v); else mem[k] = String(v); },
    getJSON: function (k) { try { return JSON.parse(this.get(k)); } catch (e) { return null; } },
    setJSON: function (k, v) { this.set(k, JSON.stringify(v)); }
  };
})();

var State = {
  getLive: function (regionId) {
    var live = LS.getJSON(LIVE_KEY);
    if (!live || !live.lastActivity) return null;
    if (now() - live.lastActivity > SETTINGS.TIMEOUT_MS) { State.end("timeout"); return null; }
    if (regionId && live.region !== regionId) { State.end("region change"); return null; }
    return live;
  },

  start: function (regionId, row) {
    var live = { region: regionId, startedAt: now(), lastActivity: now(),
                 startPage: location.pathname, page: row && row.page || "" };
    LS.setJSON(LIVE_KEY, live);
    return live;
  },

  touch: function () {
    var live = LS.getJSON(LIVE_KEY);
    if (!live) return;
    live.lastActivity = now();
    LS.setJSON(LIVE_KEY, live);
  },

  isExpired: function () {
    var live = LS.getJSON(LIVE_KEY);
    return !!(live && now() - live.lastActivity > SETTINGS.TIMEOUT_MS);
  },

  end: function (reason) {
    log("conversation ended: " + reason);
    LS.del(LIVE_KEY);
    State.forgetBotpressConversation();
    ["spotler_last_conversation_id", "spotler_lang_sent_convs", "spotler_calendar_contact"].forEach(SS.del);
    pushDataLayer({ event: "spotler_mia_end", miaEndReason: reason });
  },

  // Botpress v3.7 stores {state:{conversationId, user:{userId,userToken}}}
  // under bp-webchat-<clientId>-client. Drop the conversation, keep the user.
  forgetBotpressConversation: function () {
    LS.keys().forEach(function (k) {
      if (/^bp-webchat-.*-client$/.test(k)) {
        var v = LS.getJSON(k);
        if (v && v.state && v.state.conversationId) {
          delete v.state.conversationId;
          LS.setJSON(k, v);
        }
      } else if (/^bp-webchat-message-history-conv_/.test(k)) {
        LS.del(k);
      }
    });
    SS.keys().forEach(function (k) {
      if (/^bp-webchat-composer-files-conv_/.test(k)) SS.del(k);
    });
  },

  // Old tags' keys that would confuse the new flow.

/* ---- 40-shell.js ---- */
/* ==================================================================
   40 · Static shell: a frozen copy of the Mia chat
   Rendered in its own shadow root so site CSS can't touch it (the live
   Botpress chat is also in a shadow root). All config text is set with
   textContent: never parsed as HTML.
   ================================================================== */
var SVG_NS = "http://www.w3.org/2000/svg";
function icon(cls, paths, rect) {
  var s = document.createElementNS(SVG_NS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("class", "ico " + cls);
  s.setAttribute("aria-hidden", "true");
  paths.forEach(function (d) {
    var p = document.createElementNS(SVG_NS, "path");
    p.setAttribute("d", d);
    s.appendChild(p);
  });
  if (rect) {
    var r = document.createElementNS(SVG_NS, "rect");
    for (var k in rect) if (rect.hasOwnProperty(k)) r.setAttribute(k, rect[k]);
    s.appendChild(r);
  }
  return s;
}

function avatar(cls) {
  var wrap = el("span", { "class": cls });
  if (SETTINGS.AVATAR_URL) {
    var img = el("img", { src: SETTINGS.AVATAR_URL, alt: "" });
    img.onerror = function () { wrap.innerHTML = ""; wrap.appendChild(el("span", { "class": "av-fb", text: "M" })); };
    wrap.appendChild(img);
  } else {
    wrap.appendChild(el("span", { "class": "av-fb", text: "M" }));
  }
  return wrap;
}

/**
 * createShell(host, labels, row, handlers)
 * handlers.onSend(text, source)  source: "button" | "typed"
 * handlers.onOpen()              mic clicked with nothing typed
 * handlers.onQueue(text)         typed and sent while Mia writes her first
 *                                reply (build 4): held, sent after the swap
 */
function createShell(host, labels, row, handlers) {
  var root = host.attachShadow ? host.attachShadow({ mode: "open" }) : host;
  addStyle(CSS.shell, root);

  var container = el("div", { "class": "c", role: "region", "aria-label": labels.botName });
  var list = el("div", { "class": "list" });
  var scroll = el("div", { "class": "scroll" });
  var vp = el("div", { "class": "vp", "aria-live": "polite" });
  var openerBox = el("div", { "class": "op" });
  var userBox = el("div", { style: "display:contents" });
  var typingRow = null;

  vp.appendChild(el("div", { "class": "mq" }, [
    avatar("mq-av"),
    el("div", { "class": "mq-txt" }, [
      el("h1", { "class": "mq-title", text: labels.botName }),
      el("p", { "class": "mq-desc", text: labels.botTagline })
    ])
  ]));
  vp.appendChild(openerBox);
  vp.appendChild(userBox);
  scroll.appendChild(vp);
  list.appendChild(scroll);

  var cmp = el("div", { "class": "cmp" });
  var inw = el("div", { "class": "inw" });
  var ta = el("textarea", { rows: "1", placeholder: labels.placeholder, "aria-label": labels.placeholder });
  var send = icon("send", ["m5 12 7-7 7 7", "M12 19V5"]);
  var mic = icon("mic", ["M12 19v3", "M19 10v2a7 7 0 0 1-14 0v-2"], { x: "9", y: "2", width: "6", height: "13", rx: "3" });
  send.setAttribute("role", "button"); send.setAttribute("aria-label", "Send"); send.setAttribute("tabindex", "0");
  mic.setAttribute("role", "button"); mic.setAttribute("aria-label", "Voice input"); mic.setAttribute("tabindex", "0");
  inw.appendChild(ta); inw.appendChild(send); inw.appendChild(mic);
  cmp.appendChild(inw);

  container.appendChild(list);
  container.appendChild(cmp);
  container.appendChild(el("div", { "class": "ft" }, [footerNote(labels)]));
  root.appendChild(container);

  var locked = false;
  var buttons = [];

  function scrollDown() { scroll.scrollTop = scroll.scrollHeight; }

  function renderOpener(r) {
    openerBox.innerHTML = "";
    buttons = [];
    var bubbles = String((r && r.opener) || "").split(/\n\s*\n/).map(trim).filter(Boolean);
    bubbles.forEach(function (text, i) {
      var last = i === bubbles.length - 1;
      var vid = /^\[video\]\s*(https:\/\/\S+)$/i.exec(text);
      var bubble = vid
        ? el("div", { "class": "vid" }, [el("video", { src: vid[1], controls: "", playsinline: "", preload: "metadata" })])
        : el("div", { "class": "b" }, [el("p", { text: text })]);
      var col = bubble;
      if (last && r.buttons && r.buttons.length) {
        col = el("div", { "class": "col" }, [bubble]);
        var rowEl = el("div", { "class": "row" });
        r.buttons.forEach(function (b) {
          var btn = el("button", { "class": "btn", type: "button", text: b.label });
          btn.addEventListener("click", function () { submit(b.send || b.label, "button"); });
          buttons.push(btn);
          rowEl.appendChild(btn);
        });
        col.appendChild(rowEl);
      }
      openerBox.appendChild(el("div", { "class": "m in anim" }, [avatar("av"), col]));
    });
    scrollDown();
  }

  function syncComposer() {
    var has = !!trim(ta.value);
    if (has) inw.classList.add("has-text"); else inw.classList.remove("has-text");
    ta.style.height = "20px";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
  }

  function submit(text, source) {
    text = trim(text);
    if (!text) return;
    if (locked) {
      // Build 4 (H3): the composer stays open while Mia replies. A message
      // typed now is held and sent once her reply has landed.
      if (source !== "typed" || !handlers.onQueue) return;
      ta.value = ""; syncComposer();
      handlers.onQueue(text);
      return;
    }
    handlers.onSend(text, source);
  }

  ta.addEventListener("input", syncComposer);
  ta.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(ta.value, "typed"); }
  });
  function activate(fn) {
    return function (e) {
      if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault(); fn();
    };
  }
  var onSendClick = activate(function () { submit(ta.value, "typed"); });
  var onMicClick = activate(function () { if (!locked && handlers.onOpen) handlers.onOpen(); });
  send.addEventListener("click", onSendClick); send.addEventListener("keydown", onSendClick);
  mic.addEventListener("click", onMicClick); mic.addEventListener("keydown", onMicClick);

  renderOpener(row);

  return {
    host: host,
    setRow: function (r) { if (!locked) renderOpener(r); },
    // The opener's buttons and the mic stop working; the textarea stays
    // enabled so the visitor can keep typing (build 4).
    lock: function () {
      locked = true;
      ta.value = ""; syncComposer();
      cmp.classList.add("wait");
      buttons.forEach(function (b) { b.disabled = true; });
    },
    // The live chat starts with no greeting (skip-greeting gate), so the
    // shell lets the opener go: it fades, then folds away, and Mia glides
    // down to where the live chat will have her.
    collapseOpener: function () {
      if (!openerBox.firstChild) return;
      var h = openerBox.offsetHeight;
      openerBox.style.height = h + "px";
      void openerBox.offsetHeight; // commit the start height
      openerBox.classList.add("going");
      setTimeout(function () { openerBox.classList.add("fold"); openerBox.style.height = "0px"; }, 180);
      setTimeout(function () { openerBox.style.display = "none"; }, 180 + 520);
    },
    // queued: typed while Mia replies; it isn't delivered yet, so no status.
    showUser: function (text, queued) {
      userBox.appendChild(el("div", { "class": "m out anim" + (queued ? " queued" : "") }, [
        el("div", { "class": "b" }, [el("p", { text: text })])
      ]));
      scrollDown();
      if (queued) return;
      var status = el("p", { "class": "st", text: labels.delivered || "Delivered" });
      setTimeout(function () { userBox.appendChild(status); scrollDown(); }, 600);
    },
    showTyping: function () {
      typingRow = el("div", { "class": "m in anim" }, [
        avatar("av"), el("div", { "class": "typing", "aria-label": "typing" }, [el("i"), el("i"), el("i")])
      ]);
      userBox.appendChild(typingRow);
      scrollDown();
    },
    // Mirror the bot's first reply (text + button labels) so the swap to
    // the live chat happens with both showing the same thing.
    showReply: function (items) {
      // The reply grows in where the typing dots were, so Mia and the
      // conversation glide up instead of jumping.
      var grow = el("div", { "class": "grow" });
      var startH = 0;
      if (typingRow && typingRow.parentNode) {
        startH = typingRow.offsetHeight;
        typingRow.parentNode.insertBefore(grow, typingRow);
        typingRow.parentNode.removeChild(typingRow);
      } else {
        // No typing dots yet: the reply still goes above any held message.
        var held = userBox.querySelector(".queued");
        if (held) userBox.insertBefore(grow, held); else userBox.appendChild(grow);
      }
      typingRow = null;
      items.forEach(function (it) {
        var parts = [];
        (it.texts || []).forEach(function (txt) { parts.push(el("div", { "class": "b" }, [el("p", { text: txt })])); });
        var body;
        if (it.buttons && it.buttons.length) {
          var rowEl = el("div", { "class": "row" });
          it.buttons.forEach(function (lbl) { rowEl.appendChild(el("button", { "class": "btn", type: "button", disabled: "", text: lbl })); });
          parts.push(rowEl);
          body = el("div", { "class": "col" }, parts);
        } else {
          body = parts.length === 1 ? parts[0] : el("div", { "class": "col" }, parts);
        }
        grow.appendChild(el("div", { "class": "m in anim" }, [avatar("av"), body]));
      });
      var endH = grow.offsetHeight;
      grow.style.height = startH + "px";
      void grow.offsetHeight;
      grow.classList.add("growing");
      grow.style.height = endH + "px";
      var ticks = 0;
      (function follow() { scrollDown(); if (++ticks < 24) requestAnimationFrame(follow); })();
      setTimeout(function () { grow.style.height = ""; grow.classList.remove("growing"); }, 420);
    },
    focus: function () { try { ta.focus({ preventScroll: true }); } catch (e) {} }
  };
}

/* ---- 52-dock.js ---- */
/* ==================================================================
   52 · Glass dock (POC)
   Resting: a glass pill fixed to the bottom that types a question,
   holds it, erases it and types the next. Nothing from Botpress loads.
     arrow      → that question goes straight into the chat
     text area  → the chat grows up out of the pill: greeting, buttons,
                  and the pill's row becomes the (empty) text field
   The chat holds the usual static preview and the live chat, so the
   hand-over is the production one; the pill's field is their one text box.
   ================================================================== */
CSS.shell += CSS.shellglass;
CSS.calendar += CSS.calglass;   // the in-chat calendar in the dock's style

function createDock(labels, handlers) {
  addStyle(CSS.dock);
  addStyle(CSS.start);
  var arrowSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>';

  // the pill's row: the typing question at rest, the text field when open
  var q = el("span", { id: "mia-dock-q" });
  var input = el("input", { id: "mia-dock-in", type: "text", placeholder: labels.placeholder, "aria-label": labels.placeholder, autocomplete: "off" });
  var arrow = el("button", { "class": "mia-arrow", type: "button", "aria-label": "Send" });
  arrow.innerHTML = arrowSvg;
  var pill = el("div", { id: "mia-dock-pill" }, [q, input, arrow]);

  // the chat that grows above it
  var img = el("img", { src: SETTINGS.AVATAR_URL, alt: "" });
  var restartBtn = el("button", { type: "button", "aria-label": labels.restart, title: labels.restart });
  // drawn icons, not text characters, so they sit dead centre in their circles
  restartBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>';
  var closeBtn = el("button", { type: "button", "aria-label": labels.close, title: labels.close });
  closeBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>';
  var head = el("div", { id: "mia-dock-head" }, [
    img, el("div", { "class": "t" }, [el("b", { text: labels.botName }), el("span", { text: labels.title })]),
    restartBtn, closeBtn
  ]);
  var loading = el("div", { id: "mia-dock-loading", "aria-hidden": "true" }, [el("span")]);
  var webchat = el("div", { id: "bp-embedded-webchat" });
  // typed while Mia replies in the live chat: held at the foot of the chat
  // (see-through, no status) until her reply lands, then sent (95-poc-main)
  var held = el("div", { id: "mia-dock-held", "aria-live": "polite" });
  var body = el("div", { id: "spotler-inline-body" }, [loading, webchat, held]);
  var chat = el("div", { id: "mia-dock-chat", role: "dialog", "aria-label": labels.title }, [head, body]);
  // the AI / privacy line, under the field when open
  var ft = el("div", { id: "mia-dock-ft" }, [footerNote(labels)]);
  var dock = el("div", { id: "mia-dock", "class": "mia-glass" }, [chat, pill, ft]);
  document.body.appendChild(dock);
  try { dock.style.setProperty("--mia-font", getComputedStyle(document.body).fontFamily); } catch (e) {}   // the site's own font

  // Phones: if the page is shrunk to fit (layout wider than the screen),
  // scale the pill back up so it matches the browser's own toolbar.
  var k = 1;
  function fitTouch() {
    var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (!isMobileOrTabletUA() && !(coarse && Math.min(screen.width, screen.height) < 700)) return;
    dock.classList.add("mia-touch");
    var portrait = window.innerHeight >= window.innerWidth;
    var sw = portrait ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    // layout width; a pinch zoom only narrows innerWidth, so the larger one is the page's own
    var cw = Math.max(document.documentElement.clientWidth, window.innerWidth);
    k = sw && cw > sw * 1.02 ? Math.min(cw / sw, 3) : 1;
    dock.style.setProperty("--mia-k", k.toFixed(3));
  }
  // The open chat's height: from just below the site's menu bar (8px
  // clear) down to the field, at most 720px.
  var pillH = 0;
  function chatHeight(full) {
    var touch = dock.classList.contains("mia-touch");
    var top = 16 * k, hdr = document.getElementById("header") || document.querySelector("header");
    if (hdr) {
      var r = hdr.getBoundingClientRect(), pos = getComputedStyle(hdr).position;
      // the calendar (full) may cover the menu bar, up to its top edge; otherwise stay below it
      if ((pos === "fixed" || pos === "sticky") && r.bottom > 0 && r.bottom < window.innerHeight / 2)
        top = full ? Math.max(r.top, 0) + 12 * k : r.bottom + 8 * k;
    }
    // below the field: the AI / privacy line and the gap to the screen edge
    var below = touch || window.innerWidth <= 640 ? (20 + 26) * k : 24 + 30;
    // the field's own height (still folded just after the calendar closes: use the last full one)
    var ph = pill.offsetHeight;
    if (ph > 20) pillH = ph; else if (!full) ph = pillH;
    var room = window.innerHeight - below - ph - top - 2;
    // the calendar (full) gets up to 800px plus the field's and line's room: HubSpot's page
    // is ~715px, so more would just be empty glass
    return Math.max(220, Math.min(touch ? room : (full ? 800 : 720), room));
  }
  // While the calendar is open it covers the whole dock: the field and the
  // AI / privacy line give it their room, and come back when it closes.
  function calOpen() {
    var cal = document.getElementById("spotler-cal");
    return !!(cal && body.contains(cal) && cal.classList.contains("on"));
  }
  function sizeChat() {
    if (!dock.classList.contains("open")) return;
    // the calendar (HubSpot's page wants ~715px) gets all the height there is
    var cal = calOpen(), h = chatHeight(cal);
    if (cal) h += pill.offsetHeight + (parseFloat(getComputedStyle(ft).height) || 0);
    chat.style.height = h + "px";
  }
  function resize() {
    fitTouch();
    sizeChat();
  }
  fitTouch();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 300); });

  // ---- the typing question ----
  // each question: a string, or {text, send} (a page teaser: shown text, sent text)
  var prompts = SETTINGS.POC_PROMPTS.en, idx = 0, current = "", currentSend = "", timer = null, running = false;
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function next() {
    var p = prompts[idx++ % prompts.length];
    current = typeof p === "string" ? p : p.text;
    currentSend = typeof p === "string" ? p : (p.send || p.text);
  }
  function type(n) {
    if (!running) return;
    q.textContent = current.slice(0, n);
    if (n < current.length) timer = setTimeout(function () { type(n + 1); }, SETTINGS.POC_TYPE_MS);
    else timer = setTimeout(function () { erase(n); }, SETTINGS.POC_HOLD_MS);
  }
  function erase(n) {
    if (!running) return;
    q.textContent = current.slice(0, n);
    if (n > 0) timer = setTimeout(function () { erase(n - 1); }, SETTINGS.POC_ERASE_MS);
    else timer = setTimeout(function () { next(); type(0); }, SETTINGS.POC_GAP_MS);
  }
  function startTyping() {
    if (running || dock.classList.contains("typing-field") || dock.classList.contains("cal-pending")) return;

    next(); type(0);

  // ---- open / close: the chat grows up out of the pill, which stays put ----

    if (dock.classList.contains("open")) return;
    stopTyping();
    dock.classList.remove("cal-pending");
    dock.classList.add("typing-field");
    dock.classList.add("open");
    SS.del(CLOSED_KEY);
    if (calOpen()) document.documentElement.classList.add("mia-scroll-lock");
    sizeChat();
    if (handlers.onOpen) handlers.onOpen();
  }
  function close() {
    dock.classList.remove("open");
    chat.style.height = "0px";
    SS.set(CLOSED_KEY, "1");                                   // stays closed on the next page
    document.documentElement.classList.remove("mia-scroll-lock");   // the page scrolls again
    if (calOpen()) { showBookingPending(); return; }   // the calendar stays; the bar invites them back
    if (!trim(input.value)) { dock.classList.remove("typing-field"); startTyping(); }
  }
  // A booking left open: the bar says so (no typing questions) until it's
  // finished or cancelled; tapping it reopens the chat on the calendar.
  function showBookingPending() {
    stopTyping();
    dock.classList.remove("typing-field");
    dock.classList.add("cal-pending");
    q.textContent = labels.calResume || "Finish booking your demo";
  }
  function clearBookingPending() {
    if (!dock.classList.contains("cal-pending")) return;

  }

  // The field sends into the chat (the preview's and Botpress's own text
  // boxes are hidden: this is the one text box, before and during the chat).
  function sendTyped() {
    var text = trim(input.value);
    if (!text) { focusField(); return; }
    if (handlers.onSend && handlers.onSend(text) !== false) input.value = "";
  }

  arrow.addEventListener("click", function (e) {
    e.stopPropagation();
    if (dock.classList.contains("open")) { sendTyped(); return; }
    if (dock.classList.contains("cal-pending")) { open(); return; }   // back to the booking
    var text = currentSend;   // closed: the whole question (or the teaser's message), even mid-typing
    open();
    if (handlers.onAsk) handlers.onAsk(text);
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendTyped(); }
  });
  pill.addEventListener("click", function (e) {
    if (!dock.classList.contains("open")) {

    var on = calOpen();

    else { dock.classList.remove("cal-open"); sizeChat(); clearBookingPending(); }
  }).observe(body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });

  document.addEventListener("click", function (e) {
    if (!dock.classList.contains("open")) return;
    var t = e.target;
    // with the calendar open the booking is kept: the bar then says "finish booking"

    close();
  }, true);
  restartBtn.addEventListener("click", function () { if (handlers.onRestart) handlers.onRestart(); });

  return {
    body: body,
    webchat: webchat,
    loading: loading,
    videoWidth: 380,
    open: open,
    close: close,
    isOpen: function () { return dock.classList.contains("open"); },
    setPrompts: function (list) { if (list && list.length) { prompts = list; idx = 0; } },
    startTyping: startTyping,
    // the live chat gives up the held messages' height, so they never cover her reply
    hold: function (text) {
      held.appendChild(el("div", { "class": "h" }, [el("p", { text: text })]));
      webchat.style.height = "calc(100% - " + held.offsetHeight + "px)";
    },
    clearHeld: function () { held.innerHTML = ""; webchat.style.height = ""; },
    setRow: function () {}
  };
}

  ".bpMessageBlocksButton{background:rgba(255,255,255,.55) !important;border:1px solid rgba(11,31,77,.14) !important;color:#0B1F4D !important;border-radius:999px !important;padding:4px 12px !important;font-size:14px !important;line-height:20px !important}" +
  ".bpComposerFooter{display:none !important}" +

  ".bpMessageListScrollDownButton{display:none !important}";

// Every part of the live chat: Botpress nests its chat in more than one
// shadow root (and can use an iframe), so each one gets our styles.
function liveRoots() {
  var wrap = document.getElementById("bp-embedded-webchat"), out = [];
  if (!wrap) return out;
  (function walk(node) {
    var all = node.querySelectorAll("*");
    for (var i = 0; i < all.length; i++) {
      if (all[i].shadowRoot) { out.push(all[i].shadowRoot); walk(all[i].shadowRoot); }
      if (all[i].tagName === "IFRAME") {
        try { var d = all[i].contentDocument; if (d && d.body) { out.push(d.body); walk(d.body); } } catch (e) {}
      }
    }
  })(wrap);
  if (!out.length && wrap.querySelector("[class*='bp']")) out.push(wrap);
  return out;
}

function glassLiveChat() {
  var wrap = null, watched = [];
  function addCss(root) {
    if (root.querySelector && root.querySelector("style[data-mia-dock]")) return false;
    var css = document.createElement("style");
    css.setAttribute("data-mia-dock", "");
    css.textContent = root === wrap
      ? DOCK_LIVE_CSS.replace(/(^|\})([^{}]+)\{/g, function (m, end, sel) {
          return end + sel.split(",").map(function (s) { return "#bp-embedded-webchat " + s; }).join(",") + "{";
        })
      : DOCK_LIVE_CSS;
    (root.head || root).appendChild(css);
    return true;
  }
  // Any other large, solid-white panel Botpress paints (class names vary
  // by version): see-through too. Bubbles and buttons keep their colour.
  function clearWhite(root) {
    var box = wrap.getBoundingClientRect();
    var all = root.querySelectorAll("*");
    for (var i = 0; i < all.length; i++) {
      var n = all[i];
      if (n.__miaClear || /bpMessageBlocks|bpComposer|button/i.test(n.className + " " + n.tagName)) continue;
      var m = /rgba?\((\d+), (\d+), (\d+)(?:, ([\d.]+))?\)/.exec(getComputedStyle(n).backgroundColor);
      if (!m || +m[1] < 235 || +m[2] < 235 || +m[3] < 235 || (m[4] !== undefined && +m[4] < 0.5)) continue;
      var r = n.getBoundingClientRect();
      if (r.width < box.width * 0.6 || r.height < box.height * 0.3) continue;
      n.style.setProperty("background", "transparent", "important");
      n.__miaClear = true;
    }
  }
  // find new parts (at most every 50ms) and style them
  var queued = false;
  function discover() {
    var roots = liveRoots(), added = 0;
    for (var i = 0; i < roots.length; i++) {
      if (addCss(roots[i])) added++;
      if (watched.indexOf(roots[i]) === -1) { watched.push(roots[i]); mo.observe(roots[i], { childList: true, subtree: true }); }
      clearWhite(roots[i]);
    }
    if (added) log("glass styles on the live chat (" + added + " part" + (added > 1 ? "s" : "") + ")");
  }
  // on every change: known parts get their styles back straight away, before
  // the browser paints (no unstyled frame); new parts are found shortly after
  var mo = new MutationObserver(function () {
    for (var i = 0; i < watched.length; i++) if (addCss(watched[i])) log("glass styles put back after Botpress re-rendered");
    if (!queued) { queued = true; setTimeout(function () { queued = false; discover(); }, 50); }
  });

  // Watch the chat box from the start, with no time limit: Botpress only
  // loads when someone starts a chat, which can be minutes after the page
  // (the old 30-second poll gave up first, and the chat came up unstyled).
  wrap = document.getElementById("bp-embedded-webchat");
  if (!wrap) return;
  mo.observe(wrap, { childList: true, subtree: true });
  discover();
}

/* ---- 53-start.js ---- */
/* ==================================================================
   53 · Start screen (POC)
   Before the first message the open chat shows a start screen instead
   of an empty chat: a headline, the greeting, option cards and a few
   "others often ask" questions. Everything comes from the page's row
   (page table / marketing file), per page and language:
     title                headline (default: "Hello, I'm Mia" per language)
     opener               the greeting under it (must say Mia is an AI assistant)
     buttons[]            the cards: label, send, and optionally
                            description  the grey line under the label
                            icon         calendar | pricing | support | explore |
                                         product | chat | mail | document | none,
                                         or a picture: an https:// link (png, svg, jpg)
     prompts              the first three become "others often ask"
   A card without description or icon gets one picked from its wording.
   ================================================================== */
var START_ICONS = {
  calendar: ["M8 3v4", "M16 3v4", "M3 10h18", "M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"],
  pricing: ["M12 3 21 8 12 13 3 8z", "M3 12.5l9 5 9-5", "M3 16.5l9 5 9-5"],
  support: ["M4 14v-2a8 8 0 0 1 16 0v2", "M4 14h3v6H5a1 1 0 0 1-1-1z", "M20 14h-3v6h2a1 1 0 0 0 1-1z"],
  explore: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z", "m15.5 8.5-2 5-5 2 2-5z"],
  product: ["M21 8 12 3 3 8v8l9 5 9-5z", "M3 8l9 5 9-5", "M12 13v8"],
  chat: ["M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"],
  mail: ["M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z", "m3 7 9 6 9-6"],
  document: ["M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z", "M14 3v5h5"]
};

// Defaults per language: the headline, the "others often ask" heading, and a
// description for each kind of card.
SETTINGS.POC_START = {
  en: { title: "Hello, I’m Mia", others: "Others often ask",
        calendar: "Meet one of our product experts", pricing: "Compare our packages", support: "Get help and find answers", explore: "See what Spotler can do for you" },
  nl: { title: "Hoi, ik ben Mia", others: "Anderen vragen vaak",
        calendar: "Met een van onze productexperts", pricing: "Vergelijk onze pakketten", support: "Hulp en antwoorden", explore: "Ontdek wat Spotler voor je kan doen" },
  de: { title: "Hallo, ich bin Mia", others: "Andere fragen oft",
        calendar: "Mit einem unserer Produktexperten", pricing: "Unsere Pakete im Vergleich", support: "Hilfe und Antworten", explore: "Was Spotler für Sie tun kann" },
  es: { title: "Hola, soy Mia", others: "Otros suelen preguntar",
        calendar: "Con uno de nuestros expertos en producto", pricing: "Compara nuestros paquetes", support: "Ayuda y respuestas", explore: "Descubre lo que Spotler puede hacer por ti" },
  sv: { title: "Hej, jag är Mia", others: "Andra frågar ofta",
        calendar: "Med en av våra produktexperter", pricing: "Jämför våra paket", support: "Hjälp och svar", explore: "Se vad Spotler kan göra för dig" }
};

// A card's kind from its wording, in any of the site languages.
function guessIcon(text) {
  var t = String(text || "").toLowerCase();
  if (/demo|meeting|afspraak|termin|reuni|möte|boka/.test(t)) return "calendar";
  if (/pric|cost|preis|prijs|prijz|kost|precio|pris/.test(t)) return "pricing";
  if (/support|help|hilfe|ondersteun|soporte|hjälp/.test(t)) return "support";
  return "explore";
}

function startIcon(name) {
  if (/^https:\/\//.test(name)) {
    return el("span", { "class": "mia-ico i-img", "aria-hidden": "true" }, [el("img", { src: name, alt: "" })]);
  }
  var paths = START_ICONS[name];
  var box = el("span", { "class": "mia-ico i-" + name, "aria-hidden": "true" });
  if (!paths) return box;
  var svg = '<svg viewBox="0 0 24 24">';
  for (var i = 0; i < paths.length; i++) svg += '<path d="' + paths[i] + '"/>';
  box.innerHTML = svg + "</svg>";
  return box;
}

// Builds the start screen into `parent`. onPick(text, source) sends a
// card's or a question's message. Returns { el, hide }.
function createStart(parent, row, lang, prompts, onPick) {
  var L = SETTINGS.POC_START[lang] || SETTINGS.POC_START.en;
  var screen = el("div", { id: "mia-start" });

  var intro = el("div", { "class": "mia-intro" }, [el("h2", { text: row.title || L.title })]);
  String(row.opener || "").split(/\n\s*\n/).map(trim).filter(Boolean).forEach(function (p) {
    intro.appendChild(el("p", { text: p }));
  });
  screen.appendChild(intro);

  if (row.buttons && row.buttons.length) {
    var cards = el("div", { "class": "mia-cards" });
    row.buttons.slice(0, 6).forEach(function (b) {
      var send = b.send || b.label;
      var kind = b.icon || guessIcon(b.label + " " + send);
      var desc = b.description != null ? b.description : (L[kind] || "");
      var card = el("button", { "class": "mia-card", type: "button" }, [
        kind === "none" ? null : startIcon(kind),
        el("span", { "class": "mia-t" }, [el("b", { text: b.label }), desc ? el("span", { text: desc }) : null])
      ]);
      card.insertAdjacentHTML("beforeend", '<svg class="mia-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>');
      card.addEventListener("click", function () { onPick(send, "button"); });
      cards.appendChild(card);
    });
    screen.appendChild(cards);
  }

  var asks = (prompts || []).slice(0, 3);
  if (asks.length) {
    var chips = el("div", { "class": "mia-chips" });
    asks.forEach(function (p) {
      var text = typeof p === "string" ? p : p.text, send = typeof p === "string" ? p : (p.send || p.text);
      var chip = el("button", { "class": "mia-chip", type: "button", text: text });
      chip.addEventListener("click", function () { onPick(send, "button"); });
      chips.appendChild(chip);
    });
    screen.appendChild(el("div", { "class": "mia-ask" }, [el("h3", { text: L.others }), chips]));
  }

  parent.appendChild(screen);

  // No scrolling on first open: if it doesn't fit, step down until it does
  // (3rd question goes, card lines go, the questions go, extra greeting
  // paragraphs go, a smaller headline). Re-fitted whenever its size settles.
  var FIT = 5;
  function fit() {
    for (var i = 1; i <= FIT; i++) screen.classList.remove("fit-" + i);
    if (!screen.clientHeight) return;
    for (var l = 1; l <= FIT && screen.scrollHeight > screen.clientHeight + 1; l++) screen.classList.add("fit-" + l);
  }
  var fitTimer;
  function refit() { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 120); }   // after the open animation
  if (window.ResizeObserver) new ResizeObserver(refit).observe(screen);
  else window.addEventListener("resize", refit);
  refit();

  return {
    el: screen,
    hide: function () {
      if (!screen.parentNode) return;
      screen.classList.add("going");
      setTimeout(function () { if (screen.parentNode) screen.parentNode.removeChild(screen); }, 220);
    }
  };
}

/* ---- 60-botpress.js ---- */
/* ==================================================================
   60 · Botpress: lazy load, handover, fade, timeout, restart
   Nothing in here runs until the visitor engages (or already has a
   live conversation). Modes:
     "new"    first message pending: skip greeting, send it, fade when it
              shows in the live chat
     "resume" live conversation from an earlier page: load and reveal
     "open"   mic clicked with nothing typed: load and reveal
   ================================================================== */
var BP = {
  loaded: false,       // inject.js requested
  ready: false,        // webchat:ready fired
  revealed: false,
  pending: null,       // {text, source} waiting for a conversation
  awaitingConv: false, // a restart is in flight: ignore the old conversation
  mode: null,
  ctx: null,           // {region, labels, row, ui, shell, remountShell}
  convId: null,        // the conversation the webchat is on
  startSentFor: {},
  safetyTimer: null,
  observer: null,
  queued: []           // typed while Mia wrote her first reply (build 4)
};

function bp() { return window.botpress; }

/* ---- website contract v2 (bot: src/lib/website-events.ts) ----
   Page → bot through botpress.sendEvent:
     start     once per conversation, right before the first message
     page      every later page view while the conversation is live
     leadinfo  the company, when it becomes readable after the start
     end       before the tag ends a conversation (timeout, restart)
     demoBooked  70-hubspot.js
   The bot never greets and never replies to these. */
function pageKey() { return (BP.ctx.row && BP.ctx.row.page) || "default"; }
function campaign() { return (BP.ctx.row && BP.ctx.row.campaign) || ""; }

function startEventPayload(source) {
  var ctx = BP.ctx, row = ctx.row || {}, co = leadinfoCompany();
  return {
    type: "start",
    version: 2,
    locale: ctx.region.locale,
    startPage: location.pathname,
    startUrl: location.origin + location.pathname,
    pageKey: pageKey(),
    source: source || "unknown",
    opener: String(row.opener || "").split(/\n\s*\n/)[0].slice(0, 500),
    campaign: campaign(),
    companyDomain: co ? co.domain : "",
    companyName: co ? co.name : ""
  };
}

function sendStartEvent(convId, attempt) {
  attempt = attempt || 0;
  if (!convId || BP.startSentFor[convId]) return;
  var api = bp();
  if (!api || typeof api.sendEvent !== "function") {
    if (attempt < 40) setTimeout(function () { sendStartEvent(convId, attempt + 1); }, 250);
    return;
  }
  BP.startSentFor[convId] = true;
  var payload = startEventPayload(BP.pendingSource || BP.mode);
  try {
    Promise.resolve(api.sendEvent(payload)).then(function () {
      log("start event confirmed", payload.locale, convId);
      var live = LS.getJSON(LIVE_KEY);
      if (live) {
        live.convId = convId;
        if (payload.companyDomain) live.leadinfo = payload.companyDomain;
        LS.setJSON(LIVE_KEY, live);
      }
      sendLeadinfo();   // the company may have become readable meanwhile
    }, function (err) {
      BP.startSentFor[convId] = false;
      log("start event rejected", err);
      if (attempt < 10) setTimeout(function () { sendStartEvent(convId, attempt + 1); }, 1000);
    });
  } catch (e) {
    BP.startSentFor[convId] = false;
    if (attempt < 10) setTimeout(function () { sendStartEvent(convId, attempt + 1); }, 1000);
  }
}

// The other page → bot events: fire and forget, a few retries if rejected.
function sendBotEvent(payload, retries, attempt) {
  attempt = attempt || 0;
  var api = bp();
  if (!api || typeof api.sendEvent !== "function") {
    if (attempt < 20) setTimeout(function () { sendBotEvent(payload, retries, attempt + 1); }, 250);
    return;
  }
  function retry(err) {
    log(payload.type + " event rejected", err);
    if (attempt < retries) setTimeout(function () { sendBotEvent(payload, retries, attempt + 1); }, 1000);
  }
  try {
    Promise.resolve(api.sendEvent(payload)).then(function () { log(payload.type + " event sent"); }, retry);
  } catch (e) { retry(e); }
}

function sendPageEvent() {
  sendBotEvent({ type: "page", page: location.pathname, url: location.origin + location.pathname,
                 pageKey: pageKey(), title: String(document.title || "").slice(0, 200) }, 3);
}

// Ordering guard: the bot may see the first message before the start
// event, so the user data carries what it needs to answer it.
function writeUserData() {
  var api = bp();
  if (!api || !api.updateUser) return;
  try {
    Promise.resolve(api.updateUser({ data: { locale: BP.ctx.region.locale, pageKey: pageKey(), campaign: campaign() } }))
      .then(null, function (err) { log("updateUser rejected", err); });
  } catch (e) {}
}

/* ---- Leadinfo: the company the visitor's IP belongs to ----
   GTM's Data Layer Push tag puts it in the data layer on every page; it is
   read only with Cookiebot consent for LEADINFO_CONSENT. Known at the start:
   on the start event. Readable later (consent given, or a later page): one
   leadinfo event per company per conversation. */
function leadinfoConsent() {
  if (!SETTINGS.LEADINFO_REQUIRE_CONSENT) return true;
  var cat = SETTINGS.LEADINFO_CONSENT, cb = window.Cookiebot;
  if (cb && cb.consent) return !!cb.consent[cat];
  var m = /(?:^|;\s*)CookieConsent=([^;]*)/.exec(document.cookie || "");
  return !!(m && decodeURIComponent(m[1]).indexOf(cat + ":true") !== -1);
}

function leadinfoCompany() {
  if (!leadinfoConsent()) return null;
  var dl = window.dataLayer || [];
  for (var i = dl.length - 1; i >= 0; i--) {
    var e = dl[i];
    if (e && e.event === SETTINGS.LEADINFO_EVENT && e.company_domain) {
      return { domain: trim(String(e.company_domain)).toLowerCase().slice(0, 200),
               name: e.company_name ? trim(String(e.company_name)).slice(0, 200) : "" };
    }
  }
  return null;
}

function sendLeadinfo() {
  var live = LS.getJSON(LIVE_KEY);
  // Only into a conversation the bot already has a start event for.
  if (!BP.loaded || !live || !live.convId || live.convId !== BP.convId) return;
  var co = leadinfoCompany();
  if (!co || live.leadinfo === co.domain) return;
  live.leadinfo = co.domain;
  LS.setJSON(LIVE_KEY, live);
  sendBotEvent({ type: "leadinfo", companyDomain: co.domain, companyName: co.name }, 3);
}

["CookiebotOnAccept", "CookiebotOnConsentReady"].forEach(function (ev) {
  window.addEventListener(ev, function () { setTimeout(sendLeadinfo, 0); });
});

// Trust sendMessage's promise; retry only if the API is missing or rejects
// (same rule as the live tags, so a message is never sent twice).
function sendAsUser(text, attempt) {
  attempt = attempt || 0;
  var api = bp();
  if (!api || typeof api.sendMessage !== "function") {
    if (attempt < 20) setTimeout(function () { sendAsUser(text, attempt + 1); }, 250);
    return;
  }
  try {
    Promise.resolve(api.sendMessage(text)).then(function () {
      State.touch();
      log("first message sent");
    }, function (err) {
      log("sendMessage rejected", err);
      if (attempt < 5) setTimeout(function () { sendAsUser(text, attempt + 1); }, 1000);
    });
  } catch (e) {
    if (attempt < 5) setTimeout(function () { sendAsUser(text, attempt + 1); }, 1000);
  }
}

/* ---- build 4: typing while Mia writes her first reply (H3) ----
   The shell keeps its composer open. A message sent meanwhile shows in the
   shell as held and goes out as one normal visitor turn once her reply has
   landed and the live chat is showing. Several lines go as one message, so
   they don't interrupt each other's replies. Later turns are the live chat's
   own composer: Botpress holds the send there until the reply is in (its
   isAwaitingResponse), which the loader can't change (docs/STATUS.md). */
function queueWhileReplying(text) {
  BP.queued.push(text);
  BP.ctx.shell.showUser(text, true);
  log("held while Mia replies (" + BP.queued.length + ")");
  if (BP.revealed) flushQueued();
}

function flushQueued() {
  if (!BP.queued.length) return;
  var text = BP.queued.join("\n");
  BP.queued = [];
  log("sending the held message");
  sendAsUser(text);
}

function flushPending() {
  if (!BP.pending) return;
  var text = BP.pending.text;
  BP.pending = null;
  BP.sentText = text;
  sendAsUser(text);
}

function attachBotpressListeners() {
  var api = bp();

  api.on("webchat:initialized", function () {
    if (BP.mode !== "resume") writeUserData();
  });

  api.on("conversation", function (convId) {
    if (!convId) return;
    BP.convId = convId;
    var live = LS.getJSON(LIVE_KEY);
    var known = live && live.convId === convId;
    if (known && BP.mode === "resume") {
      log("resumed", convId);
      sendPageEvent();
      sendLeadinfo();
      return;
    }
    if (BP.awaitingConv && convId === BP.prevConvId) return; // old one, restart pending
    BP.awaitingConv = false;
    SS.del("spotler_calendar_contact");
    SS.set("spotler_last_conversation_id", convId);
    log("conversation", convId);
    setTimeout(function () {
      sendStartEvent(convId);
      flushPending();
      if (BP.mode === "open" && BP.ready && !BP.revealed) setTimeout(reveal, 500);
    }, 300);
  });

  api.on("message", function () { State.touch(); });

  api.on("webchat:ready", function () {
    BP.ready = true;
    pushDataLayer({ event: "spotler_mia_ready" });
    if (BP.mode !== "new") {
      // Plain timer, not requestAnimationFrame: rAF never fires in a tab
      // opened in the background, which left the panel on its spinner.
      setTimeout(reveal, 800);
    }
    // Fallback: no conversation event within FORCE_SEND_MS of ready.
    setTimeout(function () {
      if (BP.pending) { log("no conversation event, force-sending"); flushPending(); }
    }, SETTINGS.FORCE_SEND_MS);
    watchForUserMessage();
  });
}

function loadBotpress(mode) {
  BP.mode = mode;
  if (BP.loaded) return;
  BP.loaded = true;
  log("loading Botpress (" + mode + ")");
  if (mode !== "resume") State.forgetBotpressConversation();

  loadScript(SETTINGS.INJECT_URL, function () { log("inject.js failed to load"); });
  (function waitForApi(tries) {
    var api = bp();
    if (api && typeof api.on === "function") {
      // Every listener first: init fires webchat:initialized and the
      // conversation events, and a listener added later misses them.
      attachBotpressListeners();
      initHubSpot();
      initWebchat(api);
      return;
    }
    if (tries < 300) setTimeout(function () { waitForApi(tries + 1); }, 100);
    else log("Botpress SDK never became available");
  })(0);
}

/* ---- botpress.init: the tag starts the webchat itself ----
   No bot config script (Botpress's "Share" script calls init without an
   embed target, so the webchat would render as the floating button).
   inject.js v3.7 embeds when a version "v2" configuration's embeddedChatId
   names an element id; `selector` is passed too but v3.7 does not read it.
   Server-side webchat settings don't reach a direct init (allowedOrigins
   is still enforced by the server). botpress.init is
   read-only in v3.7, so it can't be wrapped: our labels go in here. */
function initWebchat(api) {
  var L = BP.ctx.labels;
  try {
    Promise.resolve(api.init({
      botId: SETTINGS.BOT_ID,
      clientId: SETTINGS.CLIENT_ID,
      selector: "#bp-embedded-webchat",
      configuration: {
        // Without version "v2" inject.js parses this as a legacy v0 config:
        // it drops embeddedChatId (floating button), history and more.
        version: "v2",
        embeddedChatId: "bp-embedded-webchat",
        botName: L.botName,
        botDescription: L.botTagline,
        botAvatar: SETTINGS.AVATAR_URL,
        composerPlaceholder: L.placeholder,
        footer: footerMarkdown(L),
        storageLocation: "localStorage",
        proactiveMessageEnabled: false,
        conversationHistory: true,
        // The static shell's look (40-shell.css): navy, Inter, 24px bubbles
        // (Botpress bubble radius = 6px × radius, so 4).
        color: "#002A4D",
        themeMode: "light",
        variant: "solid",
        headerVariant: "solid",
        radius: 4,
        fontFamily: "inter"
      }
    })).then(null, function (err) { log("botpress.init failed", err); });
  } catch (e) { log("botpress.init failed", e); }
}

/* ---- Botpress's own text: our labels, in the visitor's language ----
   init carries our description, placeholder and the "AI assistant ·
   Privacy" footer. The shadow-DOM pass swaps what Botpress doesn't let
   us set ("Delivered"), hides the "Today" date line (the preview has
   none either), and still covers the English bot texts in BOT_TEXT. */
var LOCAL_KEYS = ["delivered", "botTagline", "placeholder"];

function localMap() {
  var L = BP.ctx.labels, B = SETTINGS.BOT_TEXT, map = {};
  for (var i = 0; i < LOCAL_KEYS.length; i++) {
    var k = LOCAL_KEYS[i];
    if (L[k] && B[k] && L[k] !== B[k]) map[B[k]] = L[k];
  }
  if (map[B.placeholder]) map[B.placeholder.replace(/\.+$/, "")] = L.placeholder;
  return map;
}

function localiseWebchat(sr) {
  var map = localMap(), L = BP.ctx.labels, B = SETTINGS.BOT_TEXT, queued = false;
  function swapText(n) {
    var v = n.nodeValue, t = trim(v);
    if (!t) return;
    if (map.hasOwnProperty(t)) n.nodeValue = v.replace(t, map[t]);
    else if (isToday(t)) hideDateLine(n, t);
    else if (t === B.footer && n.parentNode) {
      // the bot's own footer (init not wrapped): put our note in its place
      var at = n.parentNode.tagName === "A" ? n.parentNode : n;
      at.parentNode.replaceChild(footerNote(L), at);
    }
  }
  function isToday(t) {
    var words = [B.today, L.today];
    for (var i = 0; i < words.length; i++) if (words[i] && (t === words[i] || t.indexOf(words[i] + " ") === 0)) return true;
    return false;
  }
  // The date separator, never a word inside a message: hide the largest
  // wrapper that holds nothing but this date (its lines go with it).
  // Botpress renders it as a system message (with its own top margin):
  // hide that whole message, but never a visitor's or the bot's.
  function hideDateLine(n, t) {
    var e = n.parentNode;
    if (!e || e.nodeType !== 1) return;
    var msg = e.closest && e.closest(".bpMessageContainer");
    if (msg) {
      if (msg.getAttribute("data-direction") === "system" && trim(msg.textContent) === t) msg.style.display = "none";
      return;
    }
    while (e.parentNode && e.parentNode.nodeType === 1 && e.parentNode !== sr && trim(e.parentNode.textContent) === t) e = e.parentNode;
    e.style.display = "none";
  }
  function run() {
    queued = false;
    var w = document.createTreeWalker(sr, NodeFilter.SHOW_TEXT, null, false), n, all = [];
    while ((n = w.nextNode())) all.push(n);
    for (var j = 0; j < all.length; j++) swapText(all[j]);
    var ph = sr.querySelectorAll("[placeholder]");
    for (var i = 0; i < ph.length; i++) {
      var p = trim(ph[i].getAttribute("placeholder"));
      if (map.hasOwnProperty(p)) ph[i].setAttribute("placeholder", map[p]);
    }
  }
  new MutationObserver(function () { if (!queued) { queued = true; setTimeout(run, 0); } })
    .observe(sr, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["placeholder"] });
  run();
}

/* ---- fade: reveal once the visitor's message shows in the live chat ---- */
// Where the live chat renders. Botpress v3.7 with a v2 config no longer
// uses #webchat-root, so look anywhere under #bp-embedded-webchat: a shadow
// root, a same-origin iframe, or plain light DOM.
function webchatShadow() {
  var wrap = document.getElementById("bp-embedded-webchat");
  if (!wrap) return null;
  if (wrap.shadowRoot) return found("shadow", wrap.shadowRoot);
  var all = wrap.querySelectorAll("*");
  for (var i = 0; i < all.length; i++) {
    if (all[i].shadowRoot) return found("shadow", all[i].shadowRoot);
    if (all[i].tagName === "IFRAME") {
      try {
        var doc = all[i].contentDocument;
        if (doc && doc.body && doc.body.firstChild) return found("iframe", doc.body);
      } catch (e) {}
    }
  }
  if (wrap.querySelector("textarea, .bpMessageContainer, [class*='bpComposer'], [class*='bpMessage']")) return found("light", wrap);
  return null;
  function found(kind, root) {
    if (BP.rootKind !== kind) { BP.rootKind = kind; log("webchat root: " + kind); }
    return root;
  }
}

// One header in the panel: ours, and square corners like the preview.
// Hide Botpress's own header bar by class,
// and failing that by shape: the top bar holding the bot's tagline, short,
// at the top, with a button or icon and no messages or composer in it.
function hideBotpressHeader(root) {
  try {
    var css = document.createElement("style");
    css.setAttribute("data-mia", "");
    css.textContent = root === document.getElementById("bp-embedded-webchat")
      ? "#bp-embedded-webchat [class*='bpHeader'],#bp-embedded-webchat [class*='bpModalHeader']{display:none !important}" +
        "#bp-embedded-webchat .bpContainer{border-radius:0 !important}"
      : "[class*='bpHeader'],[class*='bpModalHeader']{display:none !important}.bpContainer{border-radius:0 !important}";
    (root.head || root).appendChild(css);
  } catch (e) {}
  var tagline = BP.ctx.labels.botTagline, done = false;
  function sweep() {
    if (done) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var node, best = null, bestTop = Infinity;
    while ((node = walker.nextNode())) {
      if (trim(node.nodeValue) === tagline && node.parentNode && node.parentNode.getBoundingClientRect) {
        var el = node.parentNode, top = el.getBoundingClientRect().top;
        if (top < bestTop) { best = el; bestTop = top; }
      }
    }
    if (!best) return;
    var bar = best;
    while (bar.parentNode && bar.parentNode.nodeType === 1 && bar.parentNode !== root &&
           !bar.parentNode.querySelector("textarea, .bpMessageContainer, [class*='bpMessage']")) bar = bar.parentNode;
    var box = bar.getBoundingClientRect();
    if (!box.height) { done = true; return; }   // already hidden (the CSS above)
    var rootTop = root.host ? root.host.getBoundingClientRect().top
      : root.ownerDocument !== document ? 0
      : document.getElementById("bp-embedded-webchat").getBoundingClientRect().top;
    if (box.height > 140 || box.top - rootTop > 24 || !bar.querySelector("button, svg") ||
        bar.querySelector("textarea, .bpMessageContainer")) return;
    bar.style.setProperty("display", "none", "important");
    done = true;
    log("Botpress header hidden");
  }
  new MutationObserver(function () { setTimeout(sweep, 0); }).observe(root, { childList: true, subtree: true });
  sweep();
}

function watchForUserMessage() {
  if (BP.observer) return;
  var tries = 0;
  (function attach() {
    var sr = webchatShadow();
    if (!sr) {
      if (++tries < 300) setTimeout(attach, 100);
      else log("webchat root not found: header, date line and hand-over fade can't be adjusted");
      return;
    }
    BP.checkForUserMessage = check;
    hideBotpressHeader(sr);
    localiseWebchat(sr);
    if (BP.ctx.ui.videoWidth) sizeVideos(sr, BP.ctx.ui.videoWidth);
    // Swap only once the bot's reply is in: mirror it into the shell,
    // let it slide in there, then cross-fade to the identical live chat.
    function check() {
      if (BP.mode !== "new" || BP.revealed || BP.mirroring || BP.awaitingConv || BP.pending || !BP.sentText) return;
      var want = trim(BP.sentText);
      var all = sr.querySelectorAll(".bpMessageContainer");
      var mine = -1;
      for (var i = all.length - 1; i >= 0; i--) {
        if (all[i].getAttribute("data-direction") === "outgoing" && trim(all[i].textContent).indexOf(want) !== -1) { mine = i; break; }
      }
      if (mine === -1) return;
      var replies = [];
      for (var j = mine + 1; j < all.length; j++) {
        if (isReply(all[j])) replies.push(all[j]);
      }
      if (!replies.length) return;
      BP.mirroring = true;
      // Give a multi-part reply a moment to land, then mirror what's there.
      setTimeout(function () {
        var items = [], rich = false;
        var nodes = sr.querySelectorAll(".bpMessageContainer");
        var started = false;
        for (var k = 0; k < nodes.length; k++) {
          var n = nodes[k];
          if (!started) { if (n === all[mine]) started = true; continue; }
          if (!isReply(n)) continue;
          if (n.querySelector("video, iframe, img:not(.bpMessageAvatarImage), .bpMessageBlocksCarousel, .bpMessageBlocksCard")) { rich = true; break; }
          var texts = [];
          var bubbles = n.querySelectorAll(".bpMessageBlocksBubble");
          for (var b = 0; b < bubbles.length; b++) { var tx = textOf(bubbles[b]); if (tx) texts.push(tx); }
          var btns = [];
          var bl = n.querySelectorAll(".bpMessageBlocksButton");
          for (var c = 0; c < bl.length; c++) btns.push(textOf(bl[c]));
          if (texts.length || btns.length) items.push({ texts: texts, buttons: btns });
        }
        if (!rich && !items.length) { BP.mirroring = false; return; }  // nothing to show yet: wait
        if (!rich && BP.ctx.shell && BP.ctx.shell.showReply) {
          BP.ctx.shell.showReply(items);
          // after the bubble's own slide-in: line the preview up with the
          // live chat, then cross-fade
          setTimeout(function () { setTimeout(reveal, alignShell(sr)); }, 450);
        } else {
          reveal();                   // media in the reply: plain cross-fade
        }
      }, 350);
    }
    BP.observer = new MutationObserver(check);
    BP.observer.observe(sr, { childList: true, subtree: true });
    check();
  })();
}

// The bot's reply, not Botpress's typing dots (also an incoming message).
function isReply(n) {
  return n.getAttribute("data-direction") === "incoming" &&
    !n.querySelector("[class*='TypingIndicator']") &&
    !!n.querySelector(".bpMessageBlocksBubble, .bpMessageBlocksButton, video, iframe, img:not(.bpMessageAvatarImage), .bpMessageBlocksCarousel, .bpMessageBlocksCard");
}

// The live chat is laid out (just hidden) by now: glide the preview so its
// last bubble sits where the live chat's does, so the cross-fade doesn't
// jump. Returns how long to wait before the fade.
function alignShell(sr) {
  try {
    var host = BP.ctx.shell && BP.ctx.shell.host, shr = host && host.shadowRoot;
    // Held messages (build 4) aren't in the live chat yet: line up Mia's reply.
    var mine = shr && shr.querySelectorAll(".m:not(.queued) .b"), live = sr.querySelectorAll(".bpMessageBlocksBubble");
    if (!mine || !mine.length || !live.length) return 0;
    var d = Math.round(live[live.length - 1].getBoundingClientRect().top - mine[mine.length - 1].getBoundingClientRect().top);
    var vp = shr.querySelector(".vp");
    if (!vp || Math.abs(d) > 120) return 0;
    // the intro's Mia icon: its own nudge on top of the messages'
    var mq = shr.querySelector(".mq-av"), lmq = sr.querySelector(".bpMessageListMarqueeAvatarContainer, .bpMessageListMarqueeAvatarImage");
    var e = mq && lmq ? Math.round(lmq.getBoundingClientRect().top - mq.getBoundingClientRect().top) - d : 0;
    if (Math.abs(e) > 60) e = 0;
    if (!d && !e) return 0;
    vp.style.transition = "transform 0.2s ease-out";
    vp.style.transform = "translateY(" + d + "px)";
    if (e) { mq.style.transition = "transform 0.2s ease-out"; mq.style.transform = "translateY(" + e + "px)"; }
    log("aligned preview " + d + "px, intro " + e + "px");
    return 200;
  } catch (e) { return 0; }
}

function reveal() {
  if (BP.revealed) return;
  BP.revealed = true;
  clearTimeout(BP.safetyTimer);
  var ui = BP.ctx.ui;
  ui.webchat.classList.add("bp-ready");
  ui.loading.classList.remove("on");
  document.documentElement.classList.add("bp-chat-ready");
  var shellHost = BP.ctx.shell && BP.ctx.shell.host;
  // The live chat (on top) fades in over the preview, which stays solid
  // underneath: no dip to half-see-through in the middle. Then it goes.
  if (shellHost) {
    setTimeout(function () {
      shellHost.classList.add("mia-out");
      shellHost.classList.add("mia-gone");
    }, 450);
  }
  log("revealed live chat");
  // A message held during the first reply goes now, as the visitor's next turn.
  setTimeout(flushQueued, 500);
}

/* ---- entry points used by main ---- */
function engage(text, source) {
  var ctx = BP.ctx;
  if (BP.engaged) return;
  BP.engaged = true;
  ctx.shell.lock();
  if (text) {
    ctx.shell.collapseOpener();
    ctx.shell.showUser(text);
    setTimeout(function () { if (!BP.revealed && !BP.mirroring) ctx.shell.showTyping(); }, 900);
  }
  State.start(ctx.region.id, ctx.row);
  pushDataLayer({ event: "spotler_mia_start", miaSource: source, miaRegion: ctx.region.id,
                  miaPage: (ctx.row && ctx.row.page) || "default" });
  BP.pendingSource = source;
  BP.safetyTimer = setTimeout(reveal, SETTINGS.SAFETY_REVEAL_MS);

  BP.sentText = null;
  BP.mirroring = false;
  BP.queued = [];
  BP.pending = text ? { text: text, source: source } : null;

  if (!BP.loaded) { loadBotpress(text ? "new" : "open"); return; }

  // Botpress already on the page (after a timeout/restart): new conversation.
  BP.mode = text ? "new" : "open";
  BP.awaitingConv = true;
  BP.prevConvId = SS.get("spotler_last_conversation_id");
  writeUserData();
  watchForUserMessage();
  try {
    Promise.resolve(bp().restartConversation()).catch(function (err) { log("restart failed", err); BP.awaitingConv = false; });
  } catch (e) { BP.awaitingConv = false; }
}

function resume() {
  BP.ctx.ui.loading.classList.add("on");
  loadBotpress("resume");
}

// Teaser click: live chat → send straight in; otherwise start one.
function teaserSend(text) {
  if (BP.loaded && BP.revealed && LS.getJSON(LIVE_KEY)) {
    sendAsUser(text);
    return;
  }
  engage(text, "teaser");
}

// Restart button and timeout: end the conversation, bring the shell back.
// The bot hears it first (end event), so its end handler runs at once; a
// closed tab sends nothing and the bot's own 15-minute expiry covers it.
function resetToShell(reason) {
  var live = LS.getJSON(LIVE_KEY);
  if ((reason === "timeout" || reason === "restart") && BP.loaded && live && live.convId) {
    sendBotEvent({ type: "end", reason: reason }, 0);
  }
  State.end(reason);
  BP.engaged = false;
  BP.pending = null;
  BP.queued = [];
  if (BP.revealed || BP.loaded) {
    BP.revealed = false;
    BP.ctx.ui.webchat.classList.remove("bp-ready");
    document.documentElement.classList.remove("bp-chat-ready");
  }
  BP.ctx.ui.loading.classList.remove("on");
  BP.ctx.remountShell();
}

function startTimeoutWatch() {
  function check() {
    var live = LS.getJSON(LIVE_KEY);
    if (live && now() - live.lastActivity > SETTINGS.TIMEOUT_MS) { resetToShell("timeout"); return; }
    if (live) sendLeadinfo();
    // Ended in another tab (timeout/restart there) while this one shows the live chat.
    if (!live && BP.revealed) resetToShell("ended in another tab");
  }
  setInterval(check, SETTINGS.TIMEOUT_CHECK_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
}

/* Embedded cards: Botpress videos sit in nested shadow roots CSS can't
   reach, so size them inline. Runs on chat changes only (the live
   campaign tags polled every 700 ms forever). */
function sizeVideos(sr, width) {
  function sweep(root) {
    try {
      var media = root.querySelectorAll("video, iframe");
      for (var i = 0; i < media.length; i++) {
        var m = media[i];
        var src = m.getAttribute("src") || "";
        if (m.__miaSized || (m.tagName === "IFRAME" && !/vimeo|youtube/.test(src))) continue;
        m.__miaSized = true;
        m.style.setProperty("width", width + "px", "important");
        m.style.setProperty("max-width", "100%", "important");
        m.style.setProperty("height", "auto", "important");
        m.style.setProperty("border-radius", "12px", "important");
      }
      var all = root.querySelectorAll("*");
      for (var j = 0; j < all.length; j++) if (all[j].shadowRoot) sweep(all[j].shadowRoot);
    } catch (e) {}
  }
  var t;
  new MutationObserver(function () { clearTimeout(t); t = setTimeout(function () { sweep(sr); }, 100); })
    .observe(sr, { childList: true, subtree: true });
  sweep(sr);
}

// Text of a (hidden) live-chat element with its line breaks. innerText
// can't be used: the live chat is visibility:hidden until the swap.
function textOf(node) {
  var out = "";
  (function walk(n) {
    for (var c = n.firstChild; c; c = c.nextSibling) {
      if (c.nodeType === 3) { out += c.nodeValue; continue; }
      if (c.nodeType !== 1) continue;
      if (c.tagName === "BR") { out += "\n"; continue; }
      var block = /^(P|DIV|LI|UL|OL|H[1-6]|PRE|BLOCKQUOTE)$/.test(c.tagName);
      if (block && out && !/\n$/.test(out)) out += "\n";
      if (c.tagName === "LI") out += "• ";
      walk(c);
      if (block && !/\n$/.test(out)) out += "\n";
    }
  })(node);
  return trim(out.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n"));
}

/* ---- 70-hubspot.js ---- */
/* ==================================================================
   70 · HubSpot calendar + booking report
   Ported VERBATIM from the live INT slide-out tag (2 Oct 2026), so the
   booking flow behaves exactly as today. Called once, after the Botpress
   SDK event API exists and BEFORE the bot config loads, so its
   customEvent / message listeners are attached in time.
   Markup lives in 70-hubspot.html.
   ================================================================== */
function initHubSpot() {
  if (initHubSpot.done) return;
  initHubSpot.done = true;
    // ================================================================
    // HubSpot calendar — prefills the booking form from the visitor's
    // email, guessing first/last name and company where HubSpot hasn't
    // supplied them.
    // ================================================================
    var hsCurrentKey = null;
    var hsLastEmail = null;
    var hsLastOwnerSlug = null;
    var bookingReported = false;

    var OWNER_EMAILS = { "isabelle-chadwick": "isabelle.chadwick@spotler.com" };
    var OWNER_NAMES  = { "isabelle-chadwick": "Isabelle Chadwick" };

    var FREE_MAIL_DOMAINS = [
      "gmail", "googlemail", "hotmail", "outlook", "live", "yahoo",
      "icloud", "me", "aol", "protonmail", "proton", "gmx", "mail",
      "msn", "ymail", "hey", "zoho"
    ];

    function titleCase(s) {
      return s.replace(/(^|[\s'-])([a-z])/g, function (m, sep, ch) {
        return sep + ch.toUpperCase();
      });
    }

    function guessFromEmail(email) {
      var guess = { firstName: "", lastName: "", company: "" };
      if (!email || email.indexOf("@") === -1) return guess;

      var parts = email.toLowerCase().split("@");
      var local = parts[0].replace(/\d+/g, "");
      var domain = parts[1] || "";

      var nameParts = local.split(/[._-]+/).filter(Boolean);
      if (nameParts.length >= 2) {
        guess.firstName = titleCase(nameParts[0]);
        guess.lastName = titleCase(nameParts[nameParts.length - 1]);
      } else if (nameParts.length === 1 && nameParts[0].length > 1) {
        guess.firstName = titleCase(nameParts[0]);
      }

      var domainBase = domain.replace(/^www\./, "").split(".")[0];
      if (domainBase && FREE_MAIL_DOMAINS.indexOf(domainBase) === -1) {
        guess.company = titleCase(domainBase.replace(/[-_]+/g, " "));
      }
      return guess;
    }

    var CALENDAR_CONTACT_KEY = "spotler_calendar_contact";

    function asCleanString(value) {
      if (value === null || value === undefined) return "";
      if (typeof value !== "string" && typeof value !== "number") return "";
      return String(value).trim();
    }

    function maybeJson(value) {
      if (typeof value !== "string") return value;
      var text = value.trim();
      if (!text || ((text.charAt(0) !== "{" || text.charAt(text.length - 1) !== "}") &&
                    (text.charAt(0) !== "[" || text.charAt(text.length - 1) !== "]"))) {
        return value;
      }
      try { return JSON.parse(text); } catch (err) { return value; }
    }

    function mergeCalendarContact(target, source) {
      target = target || { email: "", firstName: "", lastName: "", company: "" };
      source = source || {};
      if (!target.email && source.email) target.email = asCleanString(source.email);
      if (!target.firstName && source.firstName) target.firstName = asCleanString(source.firstName);
      if (!target.lastName && source.lastName) target.lastName = asCleanString(source.lastName);
      if (!target.company && source.company) target.company = asCleanString(source.company);
      return target;
    }

    function contactFromAnything(raw) {
      var result = { email: "", firstName: "", lastName: "", company: "" };
      var fullName = "";
      var seen = [];

      function firstValue(obj, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = asCleanString(obj[keys[i]]);
          if (v) return v;
        }
        return "";
      }

      function visit(value, depth) {
        if (depth > 4 || value === null || value === undefined) return;
        value = maybeJson(value);

        if (typeof value === "string") {
          var exactEmail = value.trim().match(/^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i);
          if (exactEmail && !result.email) result.email = exactEmail[0];
          return;
        }
        if (typeof value !== "object") return;
        if (seen.indexOf(value) !== -1) return;
        seen.push(value);

        if (!result.email) {
          result.email = firstValue(value, [
            "email", "userEmail", "contactEmail", "emailAddress", "user_email", "contact_email"
          ]);
        }
        if (!result.firstName) {
          result.firstName = firstValue(value, [
            "firstName", "firstname", "first_name", "userFirstName", "givenName", "given_name"
          ]);
        }
        if (!result.lastName) {
          result.lastName = firstValue(value, [
            "lastName", "lastname", "last_name", "userLastName", "surname", "familyName", "family_name"
          ]);
        }
        if (!result.company) {
          result.company = firstValue(value, [
            "company", "userCompany", "companyName", "company_name", "organisation", "organization"
          ]);
        }
        if (!fullName) {
          fullName = firstValue(value, ["name", "userName", "fullName", "full_name"]);
        }

        var nestedKeys = [
          "contact", "data", "payload", "user", "userData", "profile",
          "properties", "details", "visitor", "event"
        ];
        for (var j = 0; j < nestedKeys.length; j++) {
          if (value[nestedKeys[j]] !== undefined) visit(value[nestedKeys[j]], depth + 1);
        }
      }

      visit(raw, 0);

      if (fullName && (!result.firstName || !result.lastName)) {
        var bits = fullName.split(/\s+/).filter(Boolean);
        if (!result.firstName && bits.length) result.firstName = bits[0];
        if (!result.lastName && bits.length > 1) result.lastName = bits.slice(1).join(" ");
      }

      if (result.email) {
        var guessed = guessFromEmail(result.email);
        if (!result.firstName) result.firstName = guessed.firstName;
        if (!result.lastName) result.lastName = guessed.lastName;
        if (!result.company) result.company = guessed.company;
      }

      return result;
    }

    function loadCachedCalendarContact() {
      try {
        var raw = sessionStorage.getItem(CALENDAR_CONTACT_KEY);
        return raw ? contactFromAnything(JSON.parse(raw)) : { email: "", firstName: "", lastName: "", company: "" };
      } catch (err) {
        return { email: "", firstName: "", lastName: "", company: "" };
      }
    }

    function saveCachedCalendarContact(contact) {
      if (!contact) return;
      try {
        sessionStorage.setItem(CALENDAR_CONTACT_KEY, JSON.stringify({
          email: contact.email || "",
          firstName: contact.firstName || "",
