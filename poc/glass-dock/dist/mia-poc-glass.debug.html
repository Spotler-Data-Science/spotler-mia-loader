/* ---- 60-botpress.js ---- */
/* ==================================================================
   60 · Botpress: lazy load, handover, fade, timeout, restart
   Nothing in here runs until the visitor engages (or already has a
   live conversation). Modes:
     "new"    first message pending: skip greeting, send it, fade when it
              shows in the live chat
     "resume" live conversation from an earlier page: load and reveal
     "open"   mic clicked with nothing typed: load and reveal
   ================================================================== */
var BP = {
  loaded: false,       // inject.js requested
  ready: false,        // webchat:ready fired
  revealed: false,
  pending: null,       // {text, source} waiting for a conversation
  awaitingConv: false, // a restart is in flight: ignore the old conversation
  mode: null,
  ctx: null,           // {region, labels, row, ui, shell, remountShell}
  convId: null,        // the conversation the webchat is on
  startSentFor: {},
  safetyTimer: null,
  observer: null
};

function bp() { return window.botpress; }

/* ---- website contract v2 (bot: src/lib/website-events.ts) ----
   Page → bot through botpress.sendEvent:
     start     once per conversation, right before the first message
     page      every later page view while the conversation is live
     leadinfo  the company, when it becomes readable after the start
     end       before the tag ends a conversation (timeout, restart)
     demoBooked  70-hubspot.js
   The bot never greets and never replies to these. */
function pageKey() { return (BP.ctx.row && BP.ctx.row.page) || "default"; }
function campaign() { return (BP.ctx.row && BP.ctx.row.campaign) || ""; }

function startEventPayload(source) {
  var ctx = BP.ctx, row = ctx.row || {}, co = leadinfoCompany();
  return {
    type: "start",
    version: 2,
    locale: ctx.region.locale,
    startPage: location.pathname,
    startUrl: location.origin + location.pathname,
    pageKey: pageKey(),
    source: source || "unknown",
    opener: String(row.opener || "").split(/\n\s*\n/)[0].slice(0, 500),
    campaign: campaign(),
    companyDomain: co ? co.domain : "",
    companyName: co ? co.name : ""
  };
}

function sendStartEvent(convId, attempt) {
  attempt = attempt || 0;
  if (!convId || BP.startSentFor[convId]) return;
  var api = bp();
  if (!api || typeof api.sendEvent !== "function") {
    if (attempt < 40) setTimeout(function () { sendStartEvent(convId, attempt + 1); }, 250);
    return;
  }
  BP.startSentFor[convId] = true;
  var payload = startEventPayload(BP.pendingSource || BP.mode);
  try {
    Promise.resolve(api.sendEvent(payload)).then(function () {
      log("start event confirmed", payload.locale, convId);
      var live = LS.getJSON(LIVE_KEY);
      if (live) {
        live.convId = convId;
        if (payload.companyDomain) live.leadinfo = payload.companyDomain;
        LS.setJSON(LIVE_KEY, live);
      }
      sendLeadinfo();   // the company may have become readable meanwhile
    }, function (err) {
      BP.startSentFor[convId] = false;
      log("start event rejected", err);
      if (attempt < 10) setTimeout(function () { sendStartEvent(convId, attempt + 1); }, 1000);
    });
  } catch (e) {
    BP.startSentFor[convId] = false;
    if (attempt < 10) setTimeout(function () { sendStartEvent(convId, attempt + 1); }, 1000);
  }
}

// The other page → bot events: fire and forget, a few retries if rejected.
function sendBotEvent(payload, retries, attempt) {
  attempt = attempt || 0;
  var api = bp();
  if (!api || typeof api.sendEvent !== "function") {
    if (attempt < 20) setTimeout(function () { sendBotEvent(payload, retries, attempt + 1); }, 250);
    return;
  }
  function retry(err) {
    log(payload.type + " event rejected", err);
    if (attempt < retries) setTimeout(function () { sendBotEvent(payload, retries, attempt + 1); }, 1000);
  }
  try {
    Promise.resolve(api.sendEvent(payload)).then(function () { log(payload.type + " event sent"); }, retry);
  } catch (e) { retry(e); }
}

function sendPageEvent() {
  sendBotEvent({ type: "page", page: location.pathname, url: location.origin + location.pathname,
                 pageKey: pageKey(), title: String(document.title || "").slice(0, 200) }, 3);
}

// Ordering guard: the bot may see the first message before the start
// event, so the user data carries what it needs to answer it.
function writeUserData() {
  var api = bp();
  if (!api || !api.updateUser) return;
  try {
    Promise.resolve(api.updateUser({ data: { locale: BP.ctx.region.locale, pageKey: pageKey(), campaign: campaign() } }))
      .then(null, function (err) { log("updateUser rejected", err); });
  } catch (e) {}
}

/* ---- Leadinfo: the company the visitor's IP belongs to ----
   GTM's Data Layer Push tag puts it in the data layer on every page; it is
   read only with Cookiebot consent for LEADINFO_CONSENT. Known at the start:
   on the start event. Readable later (consent given, or a later page): one
   leadinfo event per company per conversation. */
function leadinfoConsent() {
  if (!SETTINGS.LEADINFO_REQUIRE_CONSENT) return true;
  var cat = SETTINGS.LEADINFO_CONSENT, cb = window.Cookiebot;
  if (cb && cb.consent) return !!cb.consent[cat];
  var m = /(?:^|;\s*)CookieConsent=([^;]*)/.exec(document.cookie || "");
  return !!(m && decodeURIComponent(m[1]).indexOf(cat + ":true") !== -1);
}

function leadinfoCompany() {
  if (!leadinfoConsent()) return null;
  var dl = window.dataLayer || [];
  for (var i = dl.length - 1; i >= 0; i--) {
    var e = dl[i];
    if (e && e.event === SETTINGS.LEADINFO_EVENT && e.company_domain) {
      return { domain: trim(String(e.company_domain)).toLowerCase().slice(0, 200),
               name: e.company_name ? trim(String(e.company_name)).slice(0, 200) : "" };
    }
  }
  return null;
}

function sendLeadinfo() {
  var live = LS.getJSON(LIVE_KEY);
  // Only into a conversation the bot already has a start event for.
  if (!BP.loaded || !live || !live.convId || live.convId !== BP.convId) return;
  var co = leadinfoCompany();
  if (!co || live.leadinfo === co.domain) return;
  live.leadinfo = co.domain;
  LS.setJSON(LIVE_KEY, live);
  sendBotEvent({ type: "leadinfo", companyDomain: co.domain, companyName: co.name }, 3);
}

["CookiebotOnAccept", "CookiebotOnConsentReady"].forEach(function (ev) {
  window.addEventListener(ev, function () { setTimeout(sendLeadinfo, 0); });
});

// Trust sendMessage's promise; retry only if the API is missing or rejects
// (same rule as the live tags, so a message is never sent twice).
function sendAsUser(text, attempt) {
  attempt = attempt || 0;
  var api = bp();
  if (!api || typeof api.sendMessage !== "function") {
    if (attempt < 20) setTimeout(function () { sendAsUser(text, attempt + 1); }, 250);
    return;
  }
  try {
    Promise.resolve(api.sendMessage(text)).then(function () {
      State.touch();
      log("first message sent");
    }, function (err) {
      log("sendMessage rejected", err);
      if (attempt < 5) setTimeout(function () { sendAsUser(text, attempt + 1); }, 1000);
    });
  } catch (e) {
    if (attempt < 5) setTimeout(function () { sendAsUser(text, attempt + 1); }, 1000);
  }
}

function flushPending() {
  if (!BP.pending) return;
  var text = BP.pending.text;
  BP.pending = null;
  BP.sentText = text;
  sendAsUser(text);
}

function attachBotpressListeners() {
  var api = bp();

  api.on("webchat:initialized", function () {
    if (BP.mode !== "resume") writeUserData();
  });

  api.on("conversation", function (convId) {
    if (!convId) return;
    BP.convId = convId;
    var live = LS.getJSON(LIVE_KEY);
    var known = live && live.convId === convId;
    if (known && BP.mode === "resume") {
      log("resumed", convId);
      sendPageEvent();
      sendLeadinfo();
      return;
    }
    if (BP.awaitingConv && convId === BP.prevConvId) return; // old one, restart pending
    BP.awaitingConv = false;
    SS.del("spotler_calendar_contact");
    SS.set("spotler_last_conversation_id", convId);
    log("conversation", convId);
    setTimeout(function () {
      sendStartEvent(convId);
      flushPending();
      if (BP.mode === "open" && BP.ready && !BP.revealed) setTimeout(reveal, 500);
    }, 300);
  });

  api.on("message", function () { State.touch(); });

  api.on("webchat:ready", function () {
    BP.ready = true;
    pushDataLayer({ event: "spotler_mia_ready" });
    if (BP.mode !== "new") {
      // Plain timer, not requestAnimationFrame: rAF never fires in a tab
      // opened in the background, which left the panel on its spinner.
      setTimeout(reveal, 800);
    }
    // Fallback: no conversation event within FORCE_SEND_MS of ready.
    setTimeout(function () {
      if (BP.pending) { log("no conversation event, force-sending"); flushPending(); }
    }, SETTINGS.FORCE_SEND_MS);
    watchForUserMessage();
  });
}

function loadBotpress(mode) {
  BP.mode = mode;
  if (BP.loaded) return;
  BP.loaded = true;
  log("loading Botpress (" + mode + ")");
  if (mode !== "resume") State.forgetBotpressConversation();

  loadScript(SETTINGS.INJECT_URL, function () { log("inject.js failed to load"); });
  (function waitForApi(tries) {
    var api = bp();
    if (api && typeof api.on === "function") {
      // Every listener first: init fires webchat:initialized and the
      // conversation events, and a listener added later misses them.
      attachBotpressListeners();
      initHubSpot();
      initWebchat(api);
      return;
    }
    if (tries < 300) setTimeout(function () { waitForApi(tries + 1); }, 100);
    else log("Botpress SDK never became available");
  })(0);
}

/* ---- botpress.init: the tag starts the webchat itself ----
   No bot config script (Botpress's "Share" script calls init without an
   embed target, so the webchat would render as the floating button).
   inject.js v3.7 embeds when a version "v2" configuration's embeddedChatId
   names an element id; `selector` is passed too but v3.7 does not read it.
   Server-side webchat settings don't reach a direct init (allowedOrigins
   is still enforced by the server). botpress.init is
   read-only in v3.7, so it can't be wrapped: our labels go in here. */
function initWebchat(api) {
  var L = BP.ctx.labels;
  try {
    Promise.resolve(api.init({
      botId: SETTINGS.BOT_ID,
      clientId: SETTINGS.CLIENT_ID,
      selector: "#bp-embedded-webchat",
      configuration: {
        // Without version "v2" inject.js parses this as a legacy v0 config:
        // it drops embeddedChatId (floating button), history and more.
        version: "v2",
        embeddedChatId: "bp-embedded-webchat",
        botName: L.botName,
        botDescription: L.botTagline,
        botAvatar: SETTINGS.AVATAR_URL,
        composerPlaceholder: L.placeholder,
        footer: footerMarkdown(L),
        storageLocation: "localStorage",
        proactiveMessageEnabled: false,
        conversationHistory: true,
        // The static shell's look (40-shell.css): navy, Inter, 24px bubbles
        // (Botpress bubble radius = 6px × radius, so 4).
        color: "#002A4D",
        themeMode: "light",
        variant: "solid",
        headerVariant: "solid",
        radius: 4,
        fontFamily: "inter"
      }
    })).then(null, function (err) { log("botpress.init failed", err); });
  } catch (e) { log("botpress.init failed", e); }
}

/* ---- Botpress's own text: our labels, in the visitor's language ----
   init carries our description, placeholder and the "AI assistant ·
   Privacy" footer. The shadow-DOM pass swaps what Botpress doesn't let
   us set ("Delivered"), hides the "Today" date line (the preview has
   none either), and still covers the English bot texts in BOT_TEXT. */
var LOCAL_KEYS = ["delivered", "botTagline", "placeholder"];

function localMap() {
  var L = BP.ctx.labels, B = SETTINGS.BOT_TEXT, map = {};
  for (var i = 0; i < LOCAL_KEYS.length; i++) {
    var k = LOCAL_KEYS[i];
    if (L[k] && B[k] && L[k] !== B[k]) map[B[k]] = L[k];
  }
  if (map[B.placeholder]) map[B.placeholder.replace(/\.+$/, "")] = L.placeholder;
  return map;
}

function localiseWebchat(sr) {
  var map = localMap(), L = BP.ctx.labels, B = SETTINGS.BOT_TEXT, queued = false;
  function swapText(n) {
    var v = n.nodeValue, t = trim(v);
    if (!t) return;
    if (map.hasOwnProperty(t)) n.nodeValue = v.replace(t, map[t]);
    else if (isToday(t)) hideDateLine(n, t);
    else if (t === B.footer && n.parentNode) {
      // the bot's own footer (init not wrapped): put our note in its place
      var at = n.parentNode.tagName === "A" ? n.parentNode : n;
      at.parentNode.replaceChild(footerNote(L), at);
    }
  }
  function isToday(t) {
    var words = [B.today, L.today];
    for (var i = 0; i < words.length; i++) if (words[i] && (t === words[i] || t.indexOf(words[i] + " ") === 0)) return true;
    return false;
  }
  // The date separator, never a word inside a message: hide the largest
  // wrapper that holds nothing but this date (its lines go with it).
  // Botpress renders it as a system message (with its own top margin):
  // hide that whole message, but never a visitor's or the bot's.
  function hideDateLine(n, t) {
    var e = n.parentNode;
    if (!e || e.nodeType !== 1) return;
    var msg = e.closest && e.closest(".bpMessageContainer");
    if (msg) {
      if (msg.getAttribute("data-direction") === "system" && trim(msg.textContent) === t) msg.style.display = "none";
      return;
    }
    while (e.parentNode && e.parentNode.nodeType === 1 && e.parentNode !== sr && trim(e.parentNode.textContent) === t) e = e.parentNode;
    e.style.display = "none";
  }
  function run() {
    queued = false;
    var w = document.createTreeWalker(sr, NodeFilter.SHOW_TEXT, null, false), n, all = [];
    while ((n = w.nextNode())) all.push(n);
    for (var j = 0; j < all.length; j++) swapText(all[j]);
    var ph = sr.querySelectorAll("[placeholder]");
    for (var i = 0; i < ph.length; i++) {
      var p = trim(ph[i].getAttribute("placeholder"));
      if (map.hasOwnProperty(p)) ph[i].setAttribute("placeholder", map[p]);
    }
  }
  new MutationObserver(function () { if (!queued) { queued = true; setTimeout(run, 0); } })
    .observe(sr, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["placeholder"] });
  run();
}

/* ---- fade: reveal once the visitor's message shows in the live chat ---- */
// Where the live chat renders. Botpress v3.7 with a v2 config no longer
// uses #webchat-root, so look anywhere under #bp-embedded-webchat: a shadow
// root, a same-origin iframe, or plain light DOM.
function webchatShadow() {
  var wrap = document.getElementById("bp-embedded-webchat");
  if (!wrap) return null;
  if (wrap.shadowRoot) return found("shadow", wrap.shadowRoot);
  var all = wrap.querySelectorAll("*");
  for (var i = 0; i < all.length; i++) {
    if (all[i].shadowRoot) return found("shadow", all[i].shadowRoot);
    if (all[i].tagName === "IFRAME") {
      try {
        var doc = all[i].contentDocument;
        if (doc && doc.body && doc.body.firstChild) return found("iframe", doc.body);
      } catch (e) {}
    }
  }
  if (wrap.querySelector("textarea, .bpMessageContainer, [class*='bpComposer'], [class*='bpMessage']")) return found("light", wrap);
  return null;
  function found(kind, root) {
    if (BP.rootKind !== kind) { BP.rootKind = kind; log("webchat root: " + kind); }
    return root;
  }
}

// One header in the panel: ours, and square corners like the preview.
// Hide Botpress's own header bar by class,
// and failing that by shape: the top bar holding the bot's tagline, short,
// at the top, with a button or icon and no messages or composer in it.
function hideBotpressHeader(root) {
  try {
    var css = document.createElement("style");
    css.setAttribute("data-mia", "");
    css.textContent = root === document.getElementById("bp-embedded-webchat")
      ? "#bp-embedded-webchat [class*='bpHeader'],#bp-embedded-webchat [class*='bpModalHeader']{display:none !important}" +
        "#bp-embedded-webchat .bpContainer{border-radius:0 !important}"
      : "[class*='bpHeader'],[class*='bpModalHeader']{display:none !important}.bpContainer{border-radius:0 !important}";
    (root.head || root).appendChild(css);
  } catch (e) {}
  var tagline = BP.ctx.labels.botTagline, done = false;
  function sweep() {
    if (done) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var node, best = null, bestTop = Infinity;
    while ((node = walker.nextNode())) {
      if (trim(node.nodeValue) === tagline && node.parentNode && node.parentNode.getBoundingClientRect) {
        var el = node.parentNode, top = el.getBoundingClientRect().top;
        if (top < bestTop) { best = el; bestTop = top; }
      }
    }
    if (!best) return;
    var bar = best;
    while (bar.parentNode && bar.parentNode.nodeType === 1 && bar.parentNode !== root &&
           !bar.parentNode.querySelector("textarea, .bpMessageContainer, [class*='bpMessage']")) bar = bar.parentNode;
    var box = bar.getBoundingClientRect();
    if (!box.height) { done = true; return; }   // already hidden (the CSS above)
    var rootTop = root.host ? root.host.getBoundingClientRect().top
      : root.ownerDocument !== document ? 0
      : document.getElementById("bp-embedded-webchat").getBoundingClientRect().top;
    if (box.height > 140 || box.top - rootTop > 24 || !bar.querySelector("button, svg") ||
        bar.querySelector("textarea, .bpMessageContainer")) return;
    bar.style.setProperty("display", "none", "important");
    done = true;
    log("Botpress header hidden");
  }
  new MutationObserver(function () { setTimeout(sweep, 0); }).observe(root, { childList: true, subtree: true });
  sweep();
}

function watchForUserMessage() {
  if (BP.observer) return;
  var tries = 0;
  (function attach() {
    var sr = webchatShadow();
    if (!sr) {
      if (++tries < 300) setTimeout(attach, 100);
      else log("webchat root not found: header, date line and hand-over fade can't be adjusted");
      return;
    }
    BP.checkForUserMessage = check;
    hideBotpressHeader(sr);
    localiseWebchat(sr);
    if (BP.ctx.ui.videoWidth) sizeVideos(sr, BP.ctx.ui.videoWidth);
    // Swap only once the bot's reply is in: mirror it into the shell,
    // let it slide in there, then cross-fade to the identical live chat.
    function check() {
      if (BP.mode !== "new" || BP.revealed || BP.mirroring || BP.awaitingConv || BP.pending || !BP.sentText) return;
      var want = trim(BP.sentText);
      var all = sr.querySelectorAll(".bpMessageContainer");
      var mine = -1;
      for (var i = all.length - 1; i >= 0; i--) {
        if (all[i].getAttribute("data-direction") === "outgoing" && trim(all[i].textContent).indexOf(want) !== -1) { mine = i; break; }
      }
      if (mine === -1) return;
      var replies = [];
      for (var j = mine + 1; j < all.length; j++) {
        if (isReply(all[j])) replies.push(all[j]);
      }
      if (!replies.length) return;
      BP.mirroring = true;
      // Give a multi-part reply a moment to land, then mirror what's there.
      setTimeout(function () {
        var items = [], rich = false;
        var nodes = sr.querySelectorAll(".bpMessageContainer");
        var started = false;
        for (var k = 0; k < nodes.length; k++) {
          var n = nodes[k];
          if (!started) { if (n === all[mine]) started = true; continue; }
          if (!isReply(n)) continue;
          if (n.querySelector("video, iframe, img:not(.bpMessageAvatarImage), .bpMessageBlocksCarousel, .bpMessageBlocksCard")) { rich = true; break; }
          var texts = [];
          var bubbles = n.querySelectorAll(".bpMessageBlocksBubble");
          for (var b = 0; b < bubbles.length; b++) { var tx = textOf(bubbles[b]); if (tx) texts.push(tx); }
          var btns = [];
          var bl = n.querySelectorAll(".bpMessageBlocksButton");
          for (var c = 0; c < bl.length; c++) btns.push(textOf(bl[c]));
          if (texts.length || btns.length) items.push({ texts: texts, buttons: btns });
        }
        if (!rich && !items.length) { BP.mirroring = false; return; }  // nothing to show yet: wait
        if (!rich && BP.ctx.shell && BP.ctx.shell.showReply) {
          BP.ctx.shell.showReply(items);
          // after the bubble's own slide-in: line the preview up with the
          // live chat, then cross-fade
          setTimeout(function () { setTimeout(reveal, alignShell(sr)); }, 450);
        } else {
          reveal();                   // media in the reply: plain cross-fade
        }
      }, 350);
    }
    BP.observer = new MutationObserver(check);
    BP.observer.observe(sr, { childList: true, subtree: true });
    check();
  })();
}

// The bot's reply, not Botpress's typing dots (also an incoming message).
function isReply(n) {
  return n.getAttribute("data-direction") === "incoming" &&
    !n.querySelector("[class*='TypingIndicator']") &&
    !!n.querySelector(".bpMessageBlocksBubble, .bpMessageBlocksButton, video, iframe, img:not(.bpMessageAvatarImage), .bpMessageBlocksCarousel, .bpMessageBlocksCard");
}

// The live chat is laid out (just hidden) by now: glide the preview so its
// last bubble sits where the live chat's does, so the cross-fade doesn't
// jump. Returns how long to wait before the fade.
function alignShell(sr) {
  try {
    var host = BP.ctx.shell && BP.ctx.shell.host, shr = host && host.shadowRoot;
    var mine = shr && shr.querySelectorAll(".b"), live = sr.querySelectorAll(".bpMessageBlocksBubble");
    if (!mine || !mine.length || !live.length) return 0;
    var d = Math.round(live[live.length - 1].getBoundingClientRect().top - mine[mine.length - 1].getBoundingClientRect().top);
    var vp = shr.querySelector(".vp");
    if (!vp || Math.abs(d) > 120) return 0;
    // the intro's Mia icon: its own nudge on top of the messages'
    var mq = shr.querySelector(".mq-av"), lmq = sr.querySelector(".bpMessageListMarqueeAvatarContainer, .bpMessageListMarqueeAvatarImage");
    var e = mq && lmq ? Math.round(lmq.getBoundingClientRect().top - mq.getBoundingClientRect().top) - d : 0;
    if (Math.abs(e) > 60) e = 0;
    if (!d && !e) return 0;
    vp.style.transition = "transform 0.2s ease-out";
    vp.style.transform = "translateY(" + d + "px)";
    if (e) { mq.style.transition = "transform 0.2s ease-out"; mq.style.transform = "translateY(" + e + "px)"; }
    log("aligned preview " + d + "px, intro " + e + "px");
    return 200;
  } catch (e) { return 0; }
}

function reveal() {
  if (BP.revealed) return;
  BP.revealed = true;
  clearTimeout(BP.safetyTimer);
  var ui = BP.ctx.ui;
  ui.webchat.classList.add("bp-ready");
  ui.loading.classList.remove("on");
  document.documentElement.classList.add("bp-chat-ready");
  var shellHost = BP.ctx.shell && BP.ctx.shell.host;
  // The live chat (on top) fades in over the preview, which stays solid
  // underneath: no dip to half-see-through in the middle. Then it goes.
  if (shellHost) {
    setTimeout(function () {
      shellHost.classList.add("mia-out");
      shellHost.classList.add("mia-gone");
    }, 450);
  }
  log("revealed live chat");
}

/* ---- entry points used by main ---- */
function engage(text, source) {
  var ctx = BP.ctx;
  if (BP.engaged) return;
  BP.engaged = true;
  ctx.shell.lock();
  if (text) {
    ctx.shell.collapseOpener();
    ctx.shell.showUser(text);
    setTimeout(function () { if (!BP.revealed && !BP.mirroring) ctx.shell.showTyping(); }, 900);
  }
  State.start(ctx.region.id, ctx.row);
  pushDataLayer({ event: "spotler_mia_start", miaSource: source, miaRegion: ctx.region.id,
                  miaPage: (ctx.row && ctx.row.page) || "default" });
  BP.pendingSource = source;
  BP.safetyTimer = setTimeout(reveal, SETTINGS.SAFETY_REVEAL_MS);

  BP.sentText = null;
  BP.mirroring = false;
  BP.pending = text ? { text: text, source: source } : null;

  if (!BP.loaded) { loadBotpress(text ? "new" : "open"); return; }

  // Botpress already on the page (after a timeout/restart): new conversation.
  BP.mode = text ? "new" : "open";
  BP.awaitingConv = true;
  BP.prevConvId = SS.get("spotler_last_conversation_id");
  writeUserData();
  watchForUserMessage();
  try {
    Promise.resolve(bp().restartConversation()).catch(function (err) { log("restart failed", err); BP.awaitingConv = false; });
  } catch (e) { BP.awaitingConv = false; }
}

function resume() {
  BP.ctx.ui.loading.classList.add("on");
  loadBotpress("resume");
}

// Teaser click: live chat → send straight in; otherwise start one.
function teaserSend(text) {
  if (BP.loaded && BP.revealed && LS.getJSON(LIVE_KEY)) {
    sendAsUser(text);
    return;
  }
  engage(text, "teaser");
}

// Restart button and timeout: end the conversation, bring the shell back.
// The bot hears it first (end event), so its end handler runs at once; a
// closed tab sends nothing and the bot's own 15-minute expiry covers it.
function resetToShell(reason) {
  var live = LS.getJSON(LIVE_KEY);
  if ((reason === "timeout" || reason === "restart") && BP.loaded && live && live.convId) {
    sendBotEvent({ type: "end", reason: reason }, 0);
  }
  State.end(reason);
  BP.engaged = false;
  BP.pending = null;
  if (BP.revealed || BP.loaded) {
    BP.revealed = false;
    BP.ctx.ui.webchat.classList.remove("bp-ready");
    document.documentElement.classList.remove("bp-chat-ready");
  }
  BP.ctx.ui.loading.classList.remove("on");
  BP.ctx.remountShell();
}

function startTimeoutWatch() {
  function check() {
    var live = LS.getJSON(LIVE_KEY);
    if (live && now() - live.lastActivity > SETTINGS.TIMEOUT_MS) { resetToShell("timeout"); return; }
    if (live) sendLeadinfo();
    // Ended in another tab (timeout/restart there) while this one shows the live chat.
    if (!live && BP.revealed) resetToShell("ended in another tab");
  }
  setInterval(check, SETTINGS.TIMEOUT_CHECK_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
}

/* Embedded cards: Botpress videos sit in nested shadow roots CSS can't
   reach, so size them inline. Runs on chat changes only (the live
   campaign tags polled every 700 ms forever). */
function sizeVideos(sr, width) {
  function sweep(root) {
    try {
      var media = root.querySelectorAll("video, iframe");
      for (var i = 0; i < media.length; i++) {
        var m = media[i];
        var src = m.getAttribute("src") || "";
        if (m.__miaSized || (m.tagName === "IFRAME" && !/vimeo|youtube/.test(src))) continue;
        m.__miaSized = true;
        m.style.setProperty("width", width + "px", "important");
        m.style.setProperty("max-width", "100%", "important");
        m.style.setProperty("height", "auto", "important");
        m.style.setProperty("border-radius", "12px", "important");
      }
      var all = root.querySelectorAll("*");
      for (var j = 0; j < all.length; j++) if (all[j].shadowRoot) sweep(all[j].shadowRoot);
    } catch (e) {}
  }
  var t;
  new MutationObserver(function () { clearTimeout(t); t = setTimeout(function () { sweep(sr); }, 100); })
    .observe(sr, { childList: true, subtree: true });
  sweep(sr);
}

// Text of a (hidden) live-chat element with its line breaks. innerText
// can't be used: the live chat is visibility:hidden until the swap.
function textOf(node) {
  var out = "";
  (function walk(n) {
    for (var c = n.firstChild; c; c = c.nextSibling) {
      if (c.nodeType === 3) { out += c.nodeValue; continue; }
      if (c.nodeType !== 1) continue;
      if (c.tagName === "BR") { out += "\n"; continue; }
      var block = /^(P|DIV|LI|UL|OL|H[1-6]|PRE|BLOCKQUOTE)$/.test(c.tagName);
      if (block && out && !/\n$/.test(out)) out += "\n";
      if (c.tagName === "LI") out += "• ";
      walk(c);
      if (block && !/\n$/.test(out)) out += "\n";
    }
  })(node);
  return trim(out.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n"));
}

/* ---- 70-hubspot.js ---- */
/* ==================================================================
   70 · HubSpot calendar + booking report
   Ported VERBATIM from the live INT slide-out tag (2 Oct 2026), so the
   booking flow behaves exactly as today. Called once, after the Botpress
   SDK event API exists and BEFORE the bot config loads, so its
   customEvent / message listeners are attached in time.
   Markup lives in 70-hubspot.html.
   ================================================================== */
function initHubSpot() {
  if (initHubSpot.done) return;
  initHubSpot.done = true;
    // ================================================================
    // HubSpot calendar — prefills the booking form from the visitor's
    // email, guessing first/last name and company where HubSpot hasn't
    // supplied them.
    // ================================================================
    var hsCurrentKey = null;
    var hsLastEmail = null;
    var hsLastOwnerSlug = null;
    var bookingReported = false;

    var OWNER_EMAILS = { "isabelle-chadwick": "isabelle.chadwick@spotler.com" };
    var OWNER_NAMES  = { "isabelle-chadwick": "Isabelle Chadwick" };

    var FREE_MAIL_DOMAINS = [
      "gmail", "googlemail", "hotmail", "outlook", "live", "yahoo",
      "icloud", "me", "aol", "protonmail", "proton", "gmx", "mail",
      "msn", "ymail", "hey", "zoho"
    ];

    function titleCase(s) {
      return s.replace(/(^|[\s'-])([a-z])/g, function (m, sep, ch) {
        return sep + ch.toUpperCase();
      });
    }

    function guessFromEmail(email) {
      var guess = { firstName: "", lastName: "", company: "" };
      if (!email || email.indexOf("@") === -1) return guess;

      var parts = email.toLowerCase().split("@");
      var local = parts[0].replace(/\d+/g, "");
      var domain = parts[1] || "";

      var nameParts = local.split(/[._-]+/).filter(Boolean);
      if (nameParts.length >= 2) {
        guess.firstName = titleCase(nameParts[0]);
        guess.lastName = titleCase(nameParts[nameParts.length - 1]);
      } else if (nameParts.length === 1 && nameParts[0].length > 1) {
        guess.firstName = titleCase(nameParts[0]);
      }

      var domainBase = domain.replace(/^www\./, "").split(".")[0];
      if (domainBase && FREE_MAIL_DOMAINS.indexOf(domainBase) === -1) {
        guess.company = titleCase(domainBase.replace(/[-_]+/g, " "));
      }
      return guess;
    }

    var CALENDAR_CONTACT_KEY = "spotler_calendar_contact";

    function asCleanString(value) {
      if (value === null || value === undefined) return "";
      if (typeof value !== "string" && typeof value !== "number") return "";
      return String(value).trim();
    }

    function maybeJson(value) {
      if (typeof value !== "string") return value;
      var text = value.trim();
      if (!text || ((text.charAt(0) !== "{" || text.charAt(text.length - 1) !== "}") &&
                    (text.charAt(0) !== "[" || text.charAt(text.length - 1) !== "]"))) {
        return value;
      }
      try { return JSON.parse(text); } catch (err) { return value; }
    }

    function mergeCalendarContact(target, source) {
      target = target || { email: "", firstName: "", lastName: "", company: "" };
      source = source || {};
      if (!target.email && source.email) target.email = asCleanString(source.email);
      if (!target.firstName && source.firstName) target.firstName = asCleanString(source.firstName);
      if (!target.lastName && source.lastName) target.lastName = asCleanString(source.lastName);
      if (!target.company && source.company) target.company = asCleanString(source.company);
      return target;
    }

    function contactFromAnything(raw) {
      var result = { email: "", firstName: "", lastName: "", company: "" };
      var fullName = "";
      var seen = [];

      function firstValue(obj, keys) {
        for (var i = 0; i < keys.length; i++) {
          var v = asCleanString(obj[keys[i]]);
          if (v) return v;
        }
        return "";
      }

      function visit(value, depth) {
        if (depth > 4 || value === null || value === undefined) return;
        value = maybeJson(value);

        if (typeof value === "string") {
          var exactEmail = value.trim().match(/^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i);
          if (exactEmail && !result.email) result.email = exactEmail[0];
          return;
        }
        if (typeof value !== "object") return;
        if (seen.indexOf(value) !== -1) return;
        seen.push(value);

        if (!result.email) {
          result.email = firstValue(value, [
            "email", "userEmail", "contactEmail", "emailAddress", "user_email", "contact_email"
          ]);
        }
        if (!result.firstName) {
          result.firstName = firstValue(value, [
            "firstName", "firstname", "first_name", "userFirstName", "givenName", "given_name"
          ]);
        }
        if (!result.lastName) {
          result.lastName = firstValue(value, [
            "lastName", "lastname", "last_name", "userLastName", "surname", "familyName", "family_name"
          ]);
        }
        if (!result.company) {
          result.company = firstValue(value, [
            "company", "userCompany", "companyName", "company_name", "organisation", "organization"
          ]);
        }
        if (!fullName) {
          fullName = firstValue(value, ["name", "userName", "fullName", "full_name"]);
        }

        var nestedKeys = [
          "contact", "data", "payload", "user", "userData", "profile",
          "properties", "details", "visitor", "event"
        ];
        for (var j = 0; j < nestedKeys.length; j++) {
          if (value[nestedKeys[j]] !== undefined) visit(value[nestedKeys[j]], depth + 1);
        }
      }

      visit(raw, 0);

      if (fullName && (!result.firstName || !result.lastName)) {
        var bits = fullName.split(/\s+/).filter(Boolean);
        if (!result.firstName && bits.length) result.firstName = bits[0];
        if (!result.lastName && bits.length > 1) result.lastName = bits.slice(1).join(" ");
      }

      if (result.email) {
        var guessed = guessFromEmail(result.email);
        if (!result.firstName) result.firstName = guessed.firstName;
        if (!result.lastName) result.lastName = guessed.lastName;
        if (!result.company) result.company = guessed.company;
      }

      return result;
    }

    function loadCachedCalendarContact() {
      try {
        var raw = sessionStorage.getItem(CALENDAR_CONTACT_KEY);
        return raw ? contactFromAnything(JSON.parse(raw)) : { email: "", firstName: "", lastName: "", company: "" };
      } catch (err) {
        return { email: "", firstName: "", lastName: "", company: "" };
      }
    }

    function saveCachedCalendarContact(contact) {
      if (!contact) return;
      try {
        sessionStorage.setItem(CALENDAR_CONTACT_KEY, JSON.stringify({
          email: contact.email || "",
          firstName: contact.firstName || "",
          lastName: contact.lastName || "",
          company: contact.company || ""
        }));
      } catch (err) {}
    }

    // The visitor normally types their email as a standalone chat message just
    // before the calendar opens. Cache that value as a regional-flow fallback.
    // We deliberately only accept a string that is exactly an email address so
    // an email mentioned by Mia cannot accidentally become the visitor email.
    function findStandaloneEmail(value, depth, seen) {
      if (depth > 7 || value === null || value === undefined) return "";

      // Some Webchat versions serialize nested payloads. Parse JSON-looking
      // strings before testing them as plain message text.
      value = maybeJson(value);

      if (typeof value === "string") {
        var match = value.trim().match(/^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i);
        return match ? match[0] : "";
      }
      if (typeof value !== "object") return "";

      seen = seen || [];
      if (seen.indexOf(value) !== -1) return "";
      seen.push(value);

      if (Array.isArray(value)) {
        for (var a = value.length - 1; a >= 0; a--) {
          var arrayFound = findStandaloneEmail(value[a], depth + 1, seen);
          if (arrayFound) return arrayFound;
        }
        return "";
      }

      var priorityKeys = [
        "text", "value", "message", "content", "payload", "data",
        "block", "blocks", "items", "event", "input", "raw"
      ];
      for (var i = 0; i < priorityKeys.length; i++) {
        if (value[priorityKeys[i]] !== undefined) {
          var found = findStandaloneEmail(value[priorityKeys[i]], depth + 1, seen);
          if (found) return found;
        }
      }

      // Final compatibility pass for message shapes we do not know about yet.
      // Only exact email strings are accepted, so walking the remaining fields
      // cannot accidentally cache ordinary bot copy.
      for (var key in value) {
        if (!Object.prototype.hasOwnProperty.call(value, key)) continue;
        if (priorityKeys.indexOf(key) !== -1) continue;
        var genericFound = findStandaloneEmail(value[key], depth + 1, seen);
        if (genericFound) return genericFound;
      }
      return "";
    }

    function findLatestEmailInWebchat() {
      var host = document.getElementById("bp-embedded-webchat");
      if (!host) return "";

      var emails = [];
      var seenRoots = [];

      function addText(text) {
        if (!text) return;
        var matches = String(text).match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig) || [];
        for (var i = 0; i < matches.length; i++) emails.push(matches[i]);
      }

      function scanRoot(root) {
        if (!root || !root.querySelectorAll || seenRoots.indexOf(root) !== -1) return;
        seenRoots.push(root);

        // Prefer visitor/outgoing message bubbles when Botpress exposes the
        // direction attribute. This is the same rendered message the visitor
        // can see in the chat, so it is a reliable fallback when the event
        // payload itself does not include the typed text.
        var outgoing = root.querySelectorAll(
          '[data-direction="outgoing"], [data-direction="user"], ' +
          '.bpMessageContainer[data-direction="outgoing"], ' +
          '.bpMessageContainer[data-direction="user"]'
        );
        for (var o = 0; o < outgoing.length; o++) addText(outgoing[o].textContent);

        var all = root.querySelectorAll("*");
        for (var j = 0; j < all.length; j++) {
          if (all[j].shadowRoot) scanRoot(all[j].shadowRoot);
        }
      }

      scanRoot(host);

      // If the current Webchat build does not expose direction attributes,
      // fall back to the host text. We choose the final email because the
      // booking flow asks for the visitor email immediately before opening the
      // calendar.
      if (!emails.length) addText(host.textContent);

      return emails.length ? emails[emails.length - 1] : "";
    }

    function cacheCalendarEmail(email) {
      if (!email) return loadCachedCalendarContact();
      var cached = loadCachedCalendarContact();
      cached.email = email;
      cached = contactFromAnything(cached);
      saveCachedCalendarContact(cached);
      return cached;
    }

    try {
      window.botpress.on("message", function (message) {
        var email = findStandaloneEmail(message, 0, []);
        if (!email) email = findLatestEmailInWebchat();
        if (!email) return;
        cacheCalendarEmail(email);
        console.log("[HS] cached visitor email for calendar prefill");
      });
    } catch (e) {}

    function buildCalendarUrl(url, contact) {
      var parsed;
      try {
        parsed = new URL(url, window.location.href);
      } catch (err) {
        console.warn("[HS] Invalid meeting URL:", url, err);
        return url;
      }

      parsed.searchParams.set("embed", "true");

      if (contact && contact.email) {
        var guessed = guessFromEmail(contact.email);
        var firstName = contact.firstName || contact.firstname || guessed.firstName;
        var lastName  = contact.lastName  || contact.lastname  || guessed.lastName;
        var company   = contact.company   || guessed.company;

        // HubSpot meeting links use CRM property internal names in the query
        // string: email, firstname, lastname and company.
        parsed.searchParams.set("email", contact.email);
        parsed.searchParams.delete("firstName");
        parsed.searchParams.delete("lastName");
        if (firstName) parsed.searchParams.set("firstname", firstName);
        if (lastName)  parsed.searchParams.set("lastname", lastName);
        if (company)   parsed.searchParams.set("company", company);
      }

      return parsed.toString();
    }

    function unwrapCustomEvent(raw) {
      var data = maybeJson(raw);
      if (!data || typeof data !== "object") return {};

      // Botpress can expose a custom event directly, or wrapped/serialized in
      // an `event` field depending on how the Studio card was configured.
      if (data.event !== undefined) {
        var inner = maybeJson(data.event);
        if (inner && typeof inner === "object") {
          var merged = {};
          for (var k in data) {
            if (Object.prototype.hasOwnProperty.call(data, k) && k !== "event") merged[k] = data[k];
          }
          for (var k2 in inner) {
            if (Object.prototype.hasOwnProperty.call(inner, k2)) merged[k2] = inner[k2];
          }
          data = merged;
        }
      }
      return data;
    }

    function contactFromCalendarEvent(event) {
      return contactFromAnything(event);
    }

    function resolveCalendarContact(event) {
      var contact = mergeCalendarContact(contactFromCalendarEvent(event), loadCachedCalendarContact());

      // Regional Studio flows do not always copy the visitor's typed email into
      // the show-calendar custom event. Read the latest rendered visitor email
      // directly from Webchat as a browser-side fallback before opening HubSpot.
      if (!contact.email) {
        var renderedEmail = findLatestEmailInWebchat();
        if (renderedEmail) contact = mergeCalendarContact(contact, cacheCalendarEmail(renderedEmail));
      }

      contact = contactFromAnything(contact);

      // If the custom event omitted contact fields, use Botpress' current user
      // profile as another fallback. getUser() is a documented Webchat method.
      if (contact.email && contact.firstName && contact.lastName && contact.company) {
        saveCachedCalendarContact(contact);
        return Promise.resolve(contact);
      }

      if (!window.botpress || typeof window.botpress.getUser !== "function") {
        saveCachedCalendarContact(contact);
        return Promise.resolve(contact);
      }

      var userPromise;
      try {
        userPromise = Promise.resolve(window.botpress.getUser())
          .then(function (user) {
            contact = mergeCalendarContact(contact, contactFromAnything(user));
            if (!contact.email) {
              var renderedEmail = findLatestEmailInWebchat();
              if (renderedEmail) contact = mergeCalendarContact(contact, cacheCalendarEmail(renderedEmail));
            }
            contact = contactFromAnything(contact);
            saveCachedCalendarContact(contact);
            return contact;
          })
          .catch(function () { return contact; });
      } catch (err) {
        return Promise.resolve(contact);
      }

      // Never hold the calendar open for a slow profile request.
      return Promise.race([
        userPromise,
        new Promise(function (resolve) {
          setTimeout(function () { resolve(contact); }, 650);
        })
      ]);
    }

    // ---- In-chat calendar ----
    // The scheduler opens inside the chat itself: the slide-out body (the
    // panel widens to fit) or the half/full card. The page modal is only
    // the fallback when there is no chat on the page.
    addStyle(CSS.hubspot);
    var cal = null;
    function chatHost() {
      return document.getElementById("spotler-agent-body") || document.getElementById("spotler-inline-body");
    }
    function inChatCalendar() {
      var host = chatHost();
      if (!host) return null;
      if (cal && cal.layer.parentNode === host) return cal;
      if (cal && cal.layer.parentNode) cal.layer.parentNode.removeChild(cal.layer);
      var l = (BP.ctx && BP.ctx.labels) || SETTINGS.LABELS["en-GB"];
      var layer = el("div", { id: "spotler-cal", role: "dialog", "aria-label": l.calTitle || "Book a meeting" });
      var root = layer.attachShadow ? layer.attachShadow({ mode: "open" }) : layer;
      addStyle(CSS.calendar, root);
      var back = el("button", { class: "back", type: "button", text: l.calCancel || "Cancel" });
      back.addEventListener("click", function () { closeCalendar(); });
      var stage = el("div", { class: "stage" });
      var pending = el("div", { class: "m pending" }, [avatar("av"), el("div", { class: "typing", "aria-label": "typing" }, [el("i"), el("i"), el("i")])]);
      var card = el("div", { class: "card" }, [stage, pending]);
      var intro = el("div", { class: "m intro" }, [avatar("av"), el("div", { class: "b", text: l.calIntro || "Pick a time that works for you." })]);
      var bar = el("div", { class: "bar" }, [back]);
      var ft = el("div", { class: "ft" }, [footerNote(l)]);
      var sheet = el("div", { class: "sheet" }, [intro, card, bar, ft]);
      var view = el("div", { class: "c" }, [sheet]);
      root.appendChild(view);
      host.appendChild(layer);
      cal = { layer: layer, view: view, sheet: sheet, intro: intro, card: card, bar: bar, ft: ft, stage: stage, iframe: null };
      return cal;
    }
    // The card fills the chat (CSS); short chats drop the footer, then Mia's line.
    function fitCalendar() {
      if (!cal || !cal.layer.classList.contains("on")) return;
      var room = cal.layer.offsetHeight;
      cal.view.classList.toggle("tight", room < 720);
      cal.view.classList.toggle("tiny", room < 560);
      cal.view.classList.toggle("wide", cal.layer.offsetWidth >= 760);   // HubSpot's two-column layout
    }
    window.addEventListener("resize", fitCalendar);
    function openInChat(c) {
      var panel = document.getElementById("spotler-agent-panel");
      if (panel && panel.contains(c.layer)) panel.classList.add("mia-cal");
      c.layer.classList.add("on");
      document.documentElement.classList.add("mia-scroll-lock");
      c.view.classList.remove("shown");
      fitCalendar();
      void c.view.offsetWidth;             // start below, then slide up like a new message
      c.view.classList.add("shown");
      try { State.touch(); } catch (e) {}
    }
    // HubSpot has loaded and drawn: swap the typing dots for the calendar.
    function calendarReady(c) {
      if (c.view.classList.contains("ready")) return;
      fitCalendar();
      c.view.classList.add("ready");
      // Safety net: a 1px width change is a real resize inside the frame,
      // which makes HubSpot re-pick its layout for the width it now has.
      var f = c.iframe;
      if (f) {
        f.style.width = "calc(100% + 31px)";
        setTimeout(function () { f.style.width = ""; }, 120);
      }
    }
    function closeCalendar() {
      closeHubSpotModal();
      var panel = document.getElementById("spotler-agent-panel");
      if (panel) panel.classList.remove("mia-cal");
      document.documentElement.classList.remove("mia-scroll-lock");
      if (cal && cal.layer.classList.contains("on")) {
        var c = cal;
        c.view.classList.remove("shown");
        setTimeout(function () { if (!c.view.classList.contains("shown")) c.layer.classList.remove("on"); }, 320);
      }
    }
    // Closing the slide-out also closes the calendar.
    document.addEventListener("click", function (e) {
      var t = e.target;
      if (t && t.closest && t.closest("#spotler-agent-close")) closeCalendar();
    }, true);

    var hsPreviousBodyOverflow = null;
    var hsPreviousHtmlOverflow = null;

    function openHubSpotModal() {
      var modal = document.getElementById("hubspot-modal");
      if (!modal) return;

      if (modal.style.display !== "flex") {
        hsPreviousBodyOverflow = document.body.style.overflow;
        hsPreviousHtmlOverflow = document.documentElement.style.overflow;
      }

      // Lock the website behind the modal. The modal itself never scrolls.
      document.body.style.overflow = "hidden";
      document.documentElement.style.overflow = "hidden";
      modal.style.display = "flex";

    }

    function closeHubSpotModal() {
      var modal = document.getElementById("hubspot-modal");
      if (modal) modal.style.display = "none";

      // Restore whatever the site had before the calendar opened.
      document.body.style.overflow = hsPreviousBodyOverflow === null ? "" : hsPreviousBodyOverflow;
      document.documentElement.style.overflow = hsPreviousHtmlOverflow === null ? "" : hsPreviousHtmlOverflow;
      hsPreviousBodyOverflow = null;
      hsPreviousHtmlOverflow = null;
    }

    window.spotlerCloseHubSpotModal = closeCalendar;

    function showCalendar(url, contact) {
      if (!url) return;

      bookingReported = false;
      hsLastEmail = (contact && contact.email) || hsLastEmail;
      try {
        var slug = new URL(url).pathname.split("/").filter(Boolean)[0] || null;
        if (slug) hsLastOwnerSlug = slug;
      } catch (err) { /* keep previous value */ }

      var c = inChatCalendar();
      var stage = c ? c.stage : document.getElementById("hubspot-iframe-stage");
      var loading = c ? null : document.getElementById("hubspot-loading");
      var open = function () { if (c) openInChat(c); else openHubSpotModal(); };
      var fullUrl = buildCalendarUrl(url, contact);

      if (hsCurrentKey === fullUrl && stage && stage.querySelector("iframe")) {
        open();
        return;
      }

      hsCurrentKey = fullUrl;
      if (loading && !c) loading.style.display = "flex";
      if (!stage) return;

      stage.innerHTML = "";

      var iframe = document.createElement("iframe");
      // In the chat, HubSpot starts loading only once the panel has its final
      // width: it picks its layout from the width it sees when it starts.
      var panelEl = document.getElementById("spotler-agent-panel");
      var widening = !!(c && panelEl && panelEl.contains(c.layer) && !panelEl.classList.contains("mia-cal"));
      if (!widening) iframe.src = fullUrl;
      iframe.title = "Book a meeting with Spotler";
      iframe.setAttribute("frameborder", "0");
      iframe.setAttribute("allowtransparency", "true");
      iframe.setAttribute("data-hs-ignore", "true");

      iframe.addEventListener("load", function () {
        if (!iframe.getAttribute("src")) return;                       // the empty frame before src is set
        if (c) setTimeout(function () { calendarReady(c); }, 450);   // HubSpot draws after load
        else if (loading) loading.style.display = "none";
      });
      if (c) { c.iframe = iframe; c.view.classList.remove("ready"); }

      stage.appendChild(iframe);
      open();
      if (widening) setTimeout(function () { iframe.src = fullUrl; }, 400);   // panel width animates 0.35s

      // Safety fallback in case the browser suppresses the iframe load event.
      setTimeout(function () {
        if (c) calendarReady(c);
        else if (loading) loading.style.display = "none";
      }, 4000);
    }

    // === Listen for the bot's custom event to open the calendar ===
    try {
      window.botpress.on("customEvent", function (rawEvent) {
        var event = unwrapCustomEvent(rawEvent);
        if (event && event.action === "showHubSpotCalendar" && event.url) {
          resolveCalendarContact(event).then(function (contact) {
            console.log("[HS] calendar prefill:", {
              email: !!contact.email,
              firstName: !!contact.firstName,
              lastName: !!contact.lastName,
              company: !!contact.company
            });
            showCalendar(event.url, contact);
          });
        }
      });
    } catch (e) {}

    // === Detect successful bookings and report them to Botpress ===
    window.addEventListener("message", function (message) {
      var origin = message.origin || "";
      if (!/^https:\/\/meetings[^.]*\.hubspot\.com$/.test(origin)) return;

      if (message.data && message.data.meetingBookSucceeded && !bookingReported) {
        console.log('[BP] meetingBookSucceeded received from HubSpot');
        bookingReported = true;

        var mp = message.data.meetingsPayload || null;
        var ev = (mp && mp.bookingResponse) ? mp.bookingResponse.event : null;

        var bookedContact = (ev && ev.contact) ? ev.contact : null;
        var contactEmail = (bookedContact && bookedContact.email) || hsLastEmail || null;
        var guessed = guessFromEmail(contactEmail || "");
        var contactFirstName = (bookedContact && (bookedContact.firstName || bookedContact.firstname)) || guessed.firstName || null;
        var contactLastName  = (bookedContact && (bookedContact.lastName  || bookedContact.lastname))  || guessed.lastName  || null;
        var contactName = [contactFirstName, contactLastName].filter(Boolean).join(" ") || null;

        var ownerSlug = (mp && mp.userSlug) || hsLastOwnerSlug || null;

        var payload = {
          type: "demoBooked",
          booked: true,
          userEmail: contactEmail,
          userName: contactName,
          userFirstName: contactFirstName,
          userLastName: contactLastName,
          ownerSlug: ownerSlug,
          ownerEmail: (ownerSlug && OWNER_EMAILS[ownerSlug]) || null,
          ownerName: (ownerSlug && OWNER_NAMES[ownerSlug]) || null,
          meetingDate: null,
          meetingDateFormatted: null,
          meetingTime: null,
          meetingWhen: null
        };

        try {
          var raw = ev ? ev.dateString : null;
          if (raw) {
            payload.meetingDate = raw;
            var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(raw);
            if (m) payload.meetingDateFormatted = m[3] + "/" + m[2] + "/" + m[1];
          }
          var ts = ev ? Number(ev.dateTime) : NaN;
          if (ts && !isNaN(ts)) {
            var d = new Date(ts);
            payload.meetingTime =
              String(d.getHours()).padStart(2, "0") + ":" +
              String(d.getMinutes()).padStart(2, "0");
            if (!payload.meetingDateFormatted) {
              payload.meetingDateFormatted =
                String(d.getDate()).padStart(2, "0") + "/" +
                String(d.getMonth() + 1).padStart(2, "0") + "/" +
                d.getFullYear();
            }
          }
          if (payload.meetingDateFormatted) {
            payload.meetingWhen = payload.meetingDateFormatted +
              (payload.meetingTime ? " at " + payload.meetingTime : "");
          }
        } catch (err) {
          console.warn("[BP] Could not parse HubSpot booking details", err);
        }

        try { State.touch(); } catch (err) {}
        log("calendar: booking reported (conversation " + (SS.get("spotler_last_conversation_id") || "?") + ")");
        console.log('[BP] sending demoBooked to botpress:', JSON.stringify(payload));
        try {
          window.botpress.sendEvent(payload);
        } catch (err) {
          console.warn("[BP] demoBooked sendEvent failed", err);
        }

        // A beat to see HubSpot's confirmation, then back to the chat,
        // where the bot answers the demoBooked event.
        setTimeout(function () {
          closeCalendar();
          var modalStage = document.getElementById("hubspot-iframe-stage");
          if (modalStage) modalStage.innerHTML = "";
          if (cal) { cal.stage.innerHTML = ""; cal.iframe = null; }
          hsCurrentKey = null;
        }, 1500);
      }
    });

    // Escape key closes modal
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        closeCalendar();
      }
    });
  }

/* ---- 95-poc-main.js ---- */
/* ==================================================================
   95 · Boot (POC glass dock): INT pages only. Claims the page so the
   production loader stands down. If the production loader got here
   first and only shows its preview (no chat running), the POC takes
   its panel off the page and runs instead; with a chat running, the
   POC leaves it alone.
   ================================================================== */
var PROD_UI = ["spotler-agent-panel", "spotler-agent-pill", "spotler-agent-teaser", "spotler-inline-agent"];
var PROD_CLASSES = ["agent-panel-open", "mia-fit-1", "mia-fit-2", "mia-fit-3", "mia-fit-4", "mia-bar-fit", "mia-bar-tight", "mia-full-page"];

function removeProductionLoader() {
  var gone = false;
  PROD_UI.forEach(function (id) {
    var n = document.getElementById(id);
    if (n && n.parentNode) { n.parentNode.removeChild(n); gone = true; }
  });
  PROD_CLASSES.forEach(function (c) { document.body.classList.remove(c); });
  var drop = document.querySelectorAll(".mia-drop");
  for (var i = 0; i < drop.length; i++) drop[i].classList.remove("mia-drop");
  return gone;
}

// The production loader may still be waiting for its page table: watch
// for its panel for a while and take it off as soon as it appears.
function keepProductionOff() {
  if (removeProductionLoader()) log("POC: production slide-out removed");
  if (!window.MutationObserver) return;
  var mo = new MutationObserver(function () {
    if (removeProductionLoader()) log("POC: production slide-out removed");
  });
  mo.observe(document.body, { childList: true });
  setTimeout(function () { mo.disconnect(); }, 15000);
}
function detectRegion(path) {
  for (var i = 0; i < SETTINGS.REGIONS.length; i++) {
    if (SETTINGS.REGIONS[i].test.test(path)) return SETTINGS.REGIONS[i];
  }
  return SETTINGS.REGIONS[SETTINGS.REGIONS.length - 1];
}

function bootDock() {
  var path = location.pathname;
  var region = detectRegion(path);
  if (region.id !== SETTINGS.POC_REGION) return;     // not INT: leave the page to the production loader
  if (window.__spotlerMiaStarted || document.getElementById("bp-embedded-webchat")) {
    if (window.botpress || LS.getJSON(LIVE_KEY)) {
      log("POC off: the production chat is in use on this page");
      return;
    }
    log("POC: production loader " + window.__spotlerMiaStarted + " started first, taking over");
  }
  window.__spotlerMiaStarted = SETTINGS.VERSION;     // a production loader firing later stands down
  keepProductionOff();
  SETTINGS.CDN_ORIGINS.forEach(preconnect);

  var labels = SETTINGS.LABELS[region.id];
  var ctx = { region: region, labels: labels, row: null, ui: null, shell: null };
  BP.ctx = ctx;
  var started = false;

  loadConfig(function (cfg, source) {
    if (source === "late" || started) return;
    started = true;
    State.cleanLegacy();
    start(pickRow(cfg, path, region.id));
  });

  function start(row) {
    ctx.row = row;
    log("POC glass dock, page " + (row.page || "default"));
    addStyle(CSS.common);
    var hs = document.createElement("div");
    hs.innerHTML = HTML.hubspot;
    while (hs.firstChild) document.body.appendChild(hs.firstChild);

    ctx.ui = createDock(labels, {
      // arrow: the pill's question goes straight into the chat
      onAsk: function (text) {
        if (BP.loaded && BP.revealed && LS.getJSON(LIVE_KEY)) sendAsUser(text);
        else if (!BP.engaged) engage(text, "teaser");
      },
      // text area: the card with greeting, buttons and the text field
      onFocus: function () {
        var sr = ctx.shell && ctx.shell.host && ctx.shell.host.shadowRoot;
        if (sr && !BP.engaged) setTimeout(function () { ctx.shell.focus(); }, 300);
      },
      onRestart: function () { if (LS.getJSON(LIVE_KEY) || BP.engaged) resetToShell("restart"); }
    });
    if (row.prompts) ctx.ui.setPrompts(row.prompts);
    glassLiveChat();

    if (State.getLive(region.id)) { ctx.ui.open(); resume(); }
    else { mountShell(); ctx.ui.startTyping(); }
    startTimeoutWatch();
  }

  function mountShell() {
    if (ctx.shell && ctx.shell.host && ctx.shell.host.parentNode) ctx.shell.host.parentNode.removeChild(ctx.shell.host);
    var host = el("div", { id: "spotler-mia-shell" });
    host.style.setProperty("--mia-video-w", ctx.ui.videoWidth + "px");
    try { host.style.setProperty("--mia-font", getComputedStyle(document.body).fontFamily); } catch (e) {}   // the site's own font
    ctx.ui.body.insertBefore(host, ctx.ui.body.firstChild);
    ctx.shell = createShell(host, labels, ctx.row, {
      onSend: function (text, source) { engage(text, source); },
      onOpen: function () { engage(null, "open"); }
    });
  }
  ctx.remountShell = mountShell;
}

onDomReady(function () {
  try { bootDock(); } catch (e) { log("POC boot failed", e); }
});

})();
</script>
