function log() {
  try {
    var args = Array.prototype.slice.call(arguments);
    args.unshift("[Mia]");
    console.log.apply(console, args);
  } catch (e) {}
}

function now() { return new Date().getTime(); }

// Storage that never throws (private mode, blocked storage, quota).
function store(kind) {
  var s = null;
  try { s = window[kind]; s.getItem("x"); } catch (e) { s = null; }
  return {
    get: function (k) { try { return s ? s.getItem(k) : null; } catch (e) { return null; } },
    set: function (k, v) { try { if (s) s.setItem(k, v); } catch (e) {} },
    del: function (k) { try { if (s) s.removeItem(k); } catch (e) {} },
    keys: function () {
      var out = [];
      try { for (var i = 0; s && i < s.length; i++) out.push(s.key(i)); } catch (e) {}
      return out;
    },
    getJSON: function (k) { try { return JSON.parse(this.get(k)); } catch (e) { return null; } },
    setJSON: function (k, v) { try { this.set(k, JSON.stringify(v)); } catch (e) {} }
  };
}
var LS = store("localStorage");
var SS = store("sessionStorage");

// The permanent "AI assistant · Privacy" note under every chat view.
function footerNote(labels) {
  return el("p", {}, [
    document.createTextNode(labels.aiLabel + " · "),
    el("a", { href: labels.privacyUrl, target: "_blank", rel: "noopener", text: labels.privacy })
  ]);
}
function footerMarkdown(labels) {
  return labels.aiLabel + " · [" + labels.privacy + "](" + labels.privacyUrl + ")";
}

// Build an element. attrs: {class, id, text, html? (never used with config text)}
function el(tag, attrs, children) {
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (!attrs.hasOwnProperty(k) || attrs[k] == null) continue;
    if (k === "text") e.textContent = attrs[k];
    else if (k === "class") e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function addStyle(cssText, root) {
  var s = document.createElement("style");
  s.setAttribute("data-mia", "");
  s.textContent = cssText;
  (root || document.head).appendChild(s);
  return s;
}

function loadScript(src, onerror) {
  var s = document.createElement("script");
  s.src = src;
  s.async = true;
  s.onerror = onerror || function () { log("failed to load", src); };
  document.head.appendChild(s);
  return s;
}

function preconnect(origin) {
  try {
    var l = document.createElement("link");
    l.rel = "preconnect";
    l.href = origin;
    l.crossOrigin = "anonymous";
    document.head.appendChild(l);
  } catch (e) {}
}

function trim(s) { return String(s == null ? "" : s).replace(/^\s+|\s+$/g, ""); }

function pushDataLayer(obj) {
  try { window.dataLayer = window.dataLayer || []; window.dataLayer.push(obj); } catch (e) {}
}

function onDomReady(fn) {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn);
  else fn();
}

function isMobileOrTabletUA() {
  var ua = navigator.userAgent || "";
  if (/Mobi|Android|iPhone|iPad|iPod|Tablet|Silk|Kindle|PlayBook/i.test(ua)) return true;
  // iPadOS in "desktop mode" reports as Mac but has touch.
  if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;
  return false;
}

   - The live file wins when it arrives within CONFIG_WAIT_MS, so a
     published change shows on the next page load (GitHub's copy, ~5 min
     after a commit; jsDelivr only as backup). The URL carries a
     5-minute stamp so the browser's HTTP cache can't serve an old copy.
   - Slow or failed fetch: the cached copy (returning visitors) or the
     built-in DEFAULT_ROWS (first visit). A late response is cached and
     handed over too: the page swaps in its teaser and opener if the
     visitor hasn't started chatting yet.
   - A cached copy that switches the region off never decides alone:
     the live one is awaited.
   ================================================================== */
var CONFIG_CACHE_KEY = "spotler_mia_config";

function fetchConfig(cb) {
  var urls = SETTINGS.CONFIG_URLS, stamp = "?t=" + Math.floor(now() / 300000);
  (function attempt(i) {
    if (i >= urls.length) { cb(null); return; }
    var done = false, xhr;
    function fail(why) {
      if (done) return; done = true;
      log("config fetch failed (" + urls[i].split("/")[2] + "): " + why);
      attempt(i + 1);
    }
    try {
      xhr = new XMLHttpRequest();
      xhr.open("GET", urls[i] + stamp, true);
      xhr.timeout = 5000;
      xhr.onload = function () {
        if (done) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try { var cfg = validateConfig(JSON.parse(xhr.responseText)); done = true; cb(cfg); return; }
          catch (e) { fail("bad file (" + e.message + ")"); return; }
        }
        fail("HTTP " + xhr.status);
      };
      xhr.onerror = function () { fail("network or blocked (CSP?)"); };
      xhr.ontimeout = function () { fail("timeout"); };
      xhr.send();
    } catch (e) { fail(String(e)); }
  })(0);
}

// Defensive: never trust the file's shape. Bad rows are dropped, not fatal.
function validateConfig(cfg) {
  if (!cfg || typeof cfg !== "object" || !cfg.rows || !cfg.rows.length) throw new Error("no rows");
  var rows = [];
  for (var i = 0; i < cfg.rows.length; i++) {
    var r = cfg.rows[i];
    if (!r || typeof r.url_match !== "string" || typeof r.region !== "string") continue;
    rows.push({
      url_match: trim(r.url_match).toLowerCase(),
      match_type: (r.match_type === "exact" || r.match_type === "contains") ? r.match_type : "prefix",
      region: r.region,
      mode: (r.mode === "half" || r.mode === "full") ? r.mode : "slideout",
      page: typeof r.page === "string" ? r.page : "",
      // Campaign id (mailplus, feedbackpro…) for the bot's campaign profile.
      // The old `route` column (Studio routes B/C) is no longer read.
      campaign: typeof r.campaign === "string" ? trim(r.campaign).toLowerCase().slice(0, 60) : "",
      opener: typeof r.opener === "string" ? r.opener.slice(0, 1200) : "",
      buttons: (r.buttons || []).filter(function (b) { return b && trim(b.label); }).slice(0, 6).map(function (b) {
        return { label: trim(b.label).slice(0, 80), send: trim(b.send || b.label).slice(0, 300) };
      }),
      teaser_text: typeof r.teaser_text === "string" ? r.teaser_text.slice(0, 200) : "",
      teaser_send: typeof r.teaser_send === "string" ? r.teaser_send.slice(0, 300) : "",
      headline: typeof r.headline === "string" ? r.headline.slice(0, 200) : "",
      intro: typeof r.intro === "string" ? r.intro.slice(0, 400) : "",
      media_selector: typeof r.media_selector === "string" ? r.media_selector.slice(0, 300) : ""
    });
  }
  if (!rows.length) throw new Error("no valid rows");
  return {
    version: String(cfg.version || ""),
    enabledRegions: (cfg.enabledRegions && cfg.enabledRegions.length) ? cfg.enabledRegions : null,
    rows: rows
  };
}

function loadConfig(cb) {
  var cached = LS.getJSON(CONFIG_CACHE_KEY);
  if (!(cached && cached.rows)) cached = null;
  var answered = false;
  // cb returns false to turn down a cached answer (it would switch the
  // region off); the network copy then decides.
  var usedVersion = null;
  function answer(cfg, source) {
    if (answered) return;
    log("config from " + source + (cfg && cfg.version ? " v" + cfg.version : ""));
    answered = cb(cfg, source) !== false;
    if (answered) usedVersion = cfg ? cfg.version : "";
  }

  fetchConfig(function (fresh) {
    if (fresh) {
      if (Consent.ok() && (!cached || cached.version !== fresh.version)) LS.setJSON(CONFIG_CACHE_KEY, fresh);
      // Slow network: the page already started on an older copy (or the
      // built-in default). Hand over the live one so the page can catch up.
      if (answered && usedVersion !== fresh.version) {
        log("config from late network v" + fresh.version + " (was " + (usedVersion || "built-in") + ")");
        cb(fresh, "late");
        return;
      }
      answer(fresh, "network");
    } else {
      if (cached) answer(cached, "cache");
      answer(null, "built-in default (fetch failed)");
    }
  });

  setTimeout(function () {
    if (cached) answer(cached, "cache");            // network slow: last known copy
    else answer(null, "built-in default (slow)");
  }, SETTINGS.CONFIG_WAIT_MS);
}

function normalisePath(p) {
  p = String(p || "/").toLowerCase().split("?")[0].split("#")[0];
  if (p.length > 1) p = p.replace(/\/+$/, "");
  return p || "/";
}

// Most specific match wins: exact > longest prefix > "*".
function matchRow(rows, path, regionId) {
  path = normalisePath(path);
  var best = null, bestScore = -1;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.region !== regionId) continue;
    var m = r.url_match === "*" ? "*" : normalisePath(r.url_match);
    var score = -1;
    if (m === "*") score = 0;
    else if (r.match_type === "exact") { if (path === m) score = 100000 + m.length; }
    else if (r.match_type === "contains") { if (path.indexOf(String(r.url_match).toLowerCase()) !== -1) score = r.url_match.length; }
    else if (path === m || path.indexOf(m + "/") === 0) score = m.length;
    if (score > bestScore) { best = r; bestScore = score; }
  }
  return best;
}

function rowsFor(cfg) {
  return (cfg && cfg.rows) ? cfg.rows : SETTINGS.DEFAULT_ROWS;
}

// A page row only needs the columns it changes: anything left blank
// comes from that region's "*" row, then from the built-in default.
function pickRow(cfg, path, regionId) {
  var rows = rowsFor(cfg);
  var row = matchRow(rows, path, regionId);
  var base = matchRow(rows, "/__no_page__", regionId);
  var builtIn = matchRow(SETTINGS.DEFAULT_ROWS, "/__no_page__", regionId);
  var out = {};
  [builtIn, base, row].forEach(function (r) {
    if (!r) return;
    for (var k in r) {
      if (!r.hasOwnProperty(k)) continue;
      var v = r[k];
      if (k === "buttons") {
        // No buttons on a row = inherit, unless that row sets its own opener.
        if (v && v.length) out.buttons = v;
        else if (r === row && r.opener) out.buttons = [];
        continue;
      }
      if (v == null || v === "") continue;
      out[k] = v;
    }
  });
  return out;
}

/* ---- 30-state.js ---- */
/* ==================================================================
   30 · Conversation state
   One live conversation per visitor, shared by all tabs (Botpress keeps
   its conversation id in localStorage too). A conversation is "live"
   from the visitor's first message until TIMEOUT_MS without activity,
   a Restart, or a region change. Ending it clears ONLY the Botpress
   conversation id (the Botpress user is kept) and our own chat keys.
   ================================================================== */
var LIVE_KEY = "spotler_mia_live";      // {region, startedAt, lastActivity, startPage}
var PANEL_STATE_KEY = "spotlerAgentState"; // 'open' | 'dismissed' (same key as the old tags)
var TEASED_KEY = "spotlerTeaserPages";

/* ---- consent (Cookiebot) ----
   Before a chat starts the tag only keeps convenience state: the saved
   page table, panel open/closed, pages already teased. With Cookiebot on
   the page that needs "preferences" consent; without it the state lives
   in memory for this page only. Starting a chat is the visitor asking for
   the service, so from then on the chat's own state is kept. */
var Consent = {
  ok: function () {
    var cb = window.Cookiebot;
    if (cb && cb.consent) return !!cb.consent.preferences;
    var m = /(?:^|;\s*)CookieConsent=([^;]*)/.exec(document.cookie || "");
    if (m) return /preferences:true/.test(decodeURIComponent(m[1]));
    return true;                      // no consent tool on this page
  },
  chatting: function () { return !!(LS.get(LIVE_KEY) || (typeof BP !== "undefined" && BP.engaged)); },
  // Consent refused (or withdrawn): drop what was kept before it was known.
  purge: function () {
    if (Consent.ok()) return;
    LS.del(CONFIG_CACHE_KEY);
    SS.del(TEASED_KEY);
    if (!Consent.chatting()) SS.del(PANEL_STATE_KEY);
    log("no preferences consent: pre-chat storage cleared");
  }
};
["CookiebotOnDecline", "CookiebotOnConsentReady", "CookiebotOnAccept"].forEach(function (ev) {
  window.addEventListener(ev, function () { Consent.purge(); });
});

// Pre-chat session state: sessionStorage with consent (or once chatting), else memory.
var PS = (function () {
  var mem = {};
  function stored() { return Consent.ok() || Consent.chatting(); }
  return {
    get: function (k) { return stored() ? SS.get(k) : (mem.hasOwnProperty(k) ? mem[k] : null); },
    set: function (k, v) { if (stored()) SS.set(k, v); else mem[k] = String(v); },
    getJSON: function (k) { try { return JSON.parse(this.get(k)); } catch (e) { return null; } },
    setJSON: function (k, v) { this.set(k, JSON.stringify(v)); }
  };
})();

var State = {
  getLive: function (regionId) {
    var live = LS.getJSON(LIVE_KEY);
    if (!live || !live.lastActivity) return null;
    if (now() - live.lastActivity > SETTINGS.TIMEOUT_MS) { State.end("timeout"); return null; }
    if (regionId && live.region !== regionId) { State.end("region change"); return null; }
    return live;
  },

  start: function (regionId, row) {
    var live = { region: regionId, startedAt: now(), lastActivity: now(),
                 startPage: location.pathname, page: row && row.page || "" };
    LS.setJSON(LIVE_KEY, live);
    return live;
  },

  touch: function () {
    var live = LS.getJSON(LIVE_KEY);
    if (!live) return;
    live.lastActivity = now();
    LS.setJSON(LIVE_KEY, live);
  },

  isExpired: function () {
    var live = LS.getJSON(LIVE_KEY);
    return !!(live && now() - live.lastActivity > SETTINGS.TIMEOUT_MS);
  },

  end: function (reason) {
    log("conversation ended: " + reason);
    LS.del(LIVE_KEY);
    State.forgetBotpressConversation();
    ["spotler_last_conversation_id", "spotler_lang_sent_convs", "spotler_calendar_contact"].forEach(SS.del);
    pushDataLayer({ event: "spotler_mia_end", miaEndReason: reason });
  },

  // Botpress v3.7 stores {state:{conversationId, user:{userId,userToken}}}
  // under bp-webchat-<clientId>-client. Drop the conversation, keep the user.
  forgetBotpressConversation: function () {
    LS.keys().forEach(function (k) {
      if (/^bp-webchat-.*-client$/.test(k)) {
        var v = LS.getJSON(k);
        if (v && v.state && v.state.conversationId) {
          delete v.state.conversationId;
          LS.setJSON(k, v);
        }
      } else if (/^bp-webchat-message-history-conv_/.test(k)) {
        LS.del(k);
      }
    });
    SS.keys().forEach(function (k) {
      if (/^bp-webchat-composer-files-conv_/.test(k)) SS.del(k);
    });
  },

  // Old tags' keys that would confuse the new flow.
  cleanLegacy: function () {
    ["spotler_chat_region", "spotler_region_switched", "spotler_chat_last_activity"].forEach(LS.del);
    ["spotler_lang_bootstrapped"].forEach(SS.del);
  }
};

/* ---- 40-shell.js ---- */
/* ==================================================================
   40 · Static shell: a frozen copy of the Mia chat
   Rendered in its own shadow root so site CSS can't touch it (the live
   Botpress chat is also in a shadow root). All config text is set with
   textContent: never parsed as HTML.
   ================================================================== */
var SVG_NS = "http://www.w3.org/2000/svg";
function icon(cls, paths, rect) {
  var s = document.createElementNS(SVG_NS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("class", "ico " + cls);
  s.setAttribute("aria-hidden", "true");
  paths.forEach(function (d) {
    var p = document.createElementNS(SVG_NS, "path");
    p.setAttribute("d", d);
    s.appendChild(p);
  });
  if (rect) {
    var r = document.createElementNS(SVG_NS, "rect");
    for (var k in rect) if (rect.hasOwnProperty(k)) r.setAttribute(k, rect[k]);
    s.appendChild(r);
  }
  return s;
}

function avatar(cls) {
  var wrap = el("span", { "class": cls });
  if (SETTINGS.AVATAR_URL) {
    var img = el("img", { src: SETTINGS.AVATAR_URL, alt: "" });
    img.onerror = function () { wrap.innerHTML = ""; wrap.appendChild(el("span", { "class": "av-fb", text: "M" })); };
    wrap.appendChild(img);
  } else {
    wrap.appendChild(el("span", { "class": "av-fb", text: "M" }));
  }
  return wrap;
}

/**
 * createShell(host, labels, row, handlers)
 * handlers.onSend(text, source)  source: "button" | "typed"
 * handlers.onOpen()              mic clicked with nothing typed
 */
function createShell(host, labels, row, handlers) {
  var root = host.attachShadow ? host.attachShadow({ mode: "open" }) : host;
  addStyle(CSS.shell, root);

  var container = el("div", { "class": "c", role: "region", "aria-label": labels.botName });
  var list = el("div", { "class": "list" });
  var scroll = el("div", { "class": "scroll" });
  var vp = el("div", { "class": "vp", "aria-live": "polite" });
  var openerBox = el("div", { "class": "op" });
  var userBox = el("div", { style: "display:contents" });
  var typingRow = null;

  vp.appendChild(el("div", { "class": "mq" }, [
    avatar("mq-av"),
    el("div", { "class": "mq-txt" }, [
      el("h1", { "class": "mq-title", text: labels.botName }),
      el("p", { "class": "mq-desc", text: labels.botTagline })
    ])
  ]));
  vp.appendChild(openerBox);
  vp.appendChild(userBox);
  scroll.appendChild(vp);
  list.appendChild(scroll);

  var cmp = el("div", { "class": "cmp" });
  var inw = el("div", { "class": "inw" });
  var ta = el("textarea", { rows: "1", placeholder: labels.placeholder, "aria-label": labels.placeholder });
  var send = icon("send", ["m5 12 7-7 7 7", "M12 19V5"]);
  var mic = icon("mic", ["M12 19v3", "M19 10v2a7 7 0 0 1-14 0v-2"], { x: "9", y: "2", width: "6", height: "13", rx: "3" });
  send.setAttribute("role", "button"); send.setAttribute("aria-label", "Send"); send.setAttribute("tabindex", "0");
  mic.setAttribute("role", "button"); mic.setAttribute("aria-label", "Voice input"); mic.setAttribute("tabindex", "0");
  inw.appendChild(ta); inw.appendChild(send); inw.appendChild(mic);
  cmp.appendChild(inw);

  container.appendChild(list);
  container.appendChild(cmp);
  container.appendChild(el("div", { "class": "ft" }, [footerNote(labels)]));
  root.appendChild(container);

  var locked = false;
  var buttons = [];

  function scrollDown() { scroll.scrollTop = scroll.scrollHeight; }

  function renderOpener(r) {
    openerBox.innerHTML = "";
    buttons = [];
    var bubbles = String((r && r.opener) || "").split(/\n\s*\n/).map(trim).filter(Boolean);
    bubbles.forEach(function (text, i) {
      var last = i === bubbles.length - 1;
      var vid = /^\[video\]\s*(https:\/\/\S+)$/i.exec(text);
      var bubble = vid
        ? el("div", { "class": "vid" }, [el("video", { src: vid[1], controls: "", playsinline: "", preload: "metadata" })])
        : el("div", { "class": "b" }, [el("p", { text: text })]);
      var col = bubble;
      if (last && r.buttons && r.buttons.length) {
        col = el("div", { "class": "col" }, [bubble]);
        var rowEl = el("div", { "class": "row" });
        r.buttons.forEach(function (b) {
          var btn = el("button", { "class": "btn", type: "button", text: b.label });
          btn.addEventListener("click", function () { submit(b.send || b.label, "button"); });
          buttons.push(btn);
          rowEl.appendChild(btn);
        });
        col.appendChild(rowEl);
      }
      openerBox.appendChild(el("div", { "class": "m in anim" }, [avatar("av"), col]));
    });
    scrollDown();
  }

  function syncComposer() {
    var has = !!trim(ta.value);
    if (has) inw.classList.add("has-text"); else inw.classList.remove("has-text");
    ta.style.height = "20px";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
  }

  function submit(text, source) {
    text = trim(text);
    if (locked || !text) return;
    handlers.onSend(text, source);
  }

  ta.addEventListener("input", syncComposer);
  ta.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(ta.value, "typed"); }
  });
  function activate(fn) {
    return function (e) {
      if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault(); fn();
    };
  }
  var onSendClick = activate(function () { submit(ta.value, "typed"); });
  var onMicClick = activate(function () { if (!locked && handlers.onOpen) handlers.onOpen(); });
  send.addEventListener("click", onSendClick); send.addEventListener("keydown", onSendClick);
  mic.addEventListener("click", onMicClick); mic.addEventListener("keydown", onMicClick);

  renderOpener(row);

  return {
    host: host,
    setRow: function (r) { if (!locked) renderOpener(r); },
    lock: function () {
      locked = true;
      ta.value = ""; ta.disabled = true; syncComposer();
      cmp.classList.add("off");
      buttons.forEach(function (b) { b.disabled = true; });
    },
    // The live chat starts with no greeting (skip-greeting gate), so the
    // shell lets the opener go: it fades, then folds away, and Mia glides
    // down to where the live chat will have her.
    collapseOpener: function () {
      if (!openerBox.firstChild) return;
      var h = openerBox.offsetHeight;
      openerBox.style.height = h + "px";
      void openerBox.offsetHeight; // commit the start height
      openerBox.classList.add("going");
      setTimeout(function () { openerBox.classList.add("fold"); openerBox.style.height = "0px"; }, 180);
      setTimeout(function () { openerBox.style.display = "none"; }, 180 + 520);
    },
    showUser: function (text) {
      userBox.appendChild(el("div", { "class": "m out anim" }, [
        el("div", { "class": "b" }, [el("p", { text: text })])
      ]));
      scrollDown();
      var status = el("p", { "class": "st", text: labels.delivered || "Delivered" });
      setTimeout(function () { userBox.appendChild(status); scrollDown(); }, 600);
    },
    showTyping: function () {
      typingRow = el("div", { "class": "m in anim" }, [
        avatar("av"), el("div", { "class": "typing", "aria-label": "typing" }, [el("i"), el("i"), el("i")])
      ]);
      userBox.appendChild(typingRow);
      scrollDown();
    },
    // Mirror the bot's first reply (text + button labels) so the swap to
    // the live chat happens with both showing the same thing.
    showReply: function (items) {
      // The reply grows in where the typing dots were, so Mia and the
      // conversation glide up instead of jumping.
      var grow = el("div", { "class": "grow" });
      var startH = 0;
      if (typingRow && typingRow.parentNode) {
        startH = typingRow.offsetHeight;
        typingRow.parentNode.insertBefore(grow, typingRow);
        typingRow.parentNode.removeChild(typingRow);
      } else {
        userBox.appendChild(grow);
      }
      typingRow = null;
      items.forEach(function (it) {
        var parts = [];
        (it.texts || []).forEach(function (txt) { parts.push(el("div", { "class": "b" }, [el("p", { text: txt })])); });
        var body;
        if (it.buttons && it.buttons.length) {
          var rowEl = el("div", { "class": "row" });
          it.buttons.forEach(function (lbl) { rowEl.appendChild(el("button", { "class": "btn", type: "button", disabled: "", text: lbl })); });
          parts.push(rowEl);
          body = el("div", { "class": "col" }, parts);
        } else {
          body = parts.length === 1 ? parts[0] : el("div", { "class": "col" }, parts);
        }
        grow.appendChild(el("div", { "class": "m in anim" }, [avatar("av"), body]));
      });
      var endH = grow.offsetHeight;
      grow.style.height = startH + "px";
      void grow.offsetHeight;
      grow.classList.add("growing");
      grow.style.height = endH + "px";
      var ticks = 0;
      (function follow() { scrollDown(); if (++ticks < 24) requestAnimationFrame(follow); })();
      setTimeout(function () { grow.style.height = ""; grow.classList.remove("growing"); }, 420);
    },
    focus: function () { try { ta.focus({ preventScroll: true }); } catch (e) {} }
  };
}

/* ---- 50-slideout.js ---- */
/* ==================================================================
   50 · Slide-out mode: panel, pill, teaser, page squeeze
   Behaviour matches the live slide-out tags: open on first visit,
   remember open/dismissed for the session, teaser bubble 4 s after the
   pill shows (once per page per session).
   ================================================================== */
function createSlideout(region, labels, handlers) {
  addStyle(CSS.slideout);
  // CSS variables live in our own <style>, NOT on <html style>: the theme's
  // scroll-lock (used by its mobile menu) crashes when <html> has a style
  // attribute with more than one declaration.
  var vars = { "--spotler-agent-w": "400px", "--spotler-banner-h": SETTINGS.DEFAULT_BANNER_PX + "px" };
  var varsStyle = addStyle("");
  function setVar(name, value) {
    vars[name] = value;
    var css = ":root{";
    for (var k in vars) if (vars.hasOwnProperty(k)) css += k + ":" + vars[k] + ";";
    varsStyle.textContent = css + "}";
  }

  var title = el("span", { id: "spotler-agent-title", text: labels.title });
  var restartBtn = el("button", { id: "spotler-agent-restart", type: "button", "aria-label": labels.restart, title: labels.restart });
  restartBtn.innerHTML = "&#8635;";
  var closeBtn = el("button", { id: "spotler-agent-close", type: "button", "aria-label": labels.close, title: labels.close });
  closeBtn.innerHTML = "&#10005;";
  var body = el("div", { id: "spotler-agent-body" });
  var loading = el("div", { id: "spotler-agent-loading", "aria-hidden": "true" }, [el("span")]);
  var webchat = el("div", { id: "bp-embedded-webchat" });
  body.appendChild(loading);
  body.appendChild(webchat);

  var panel = el("div", { id: "spotler-agent-panel", "aria-label": labels.title }, [
    el("div", { id: "spotler-agent-header" }, [
      title,
      el("span", { id: "spotler-agent-header-actions" }, [restartBtn, closeBtn])
    ]),
    body
  ]);

  var pill = el("button", { id: "spotler-agent-pill", type: "button" });
  pill.appendChild(el("span", { "class": "pill-spark", "aria-hidden": "true" }));
  pill.firstChild.innerHTML = "&#10022;";
  pill.appendChild(document.createTextNode(" " + labels.pill));

  var teaserText = el("span", { id: "spotler-agent-teaser-text" });
  var teaserClose = el("button", { id: "spotler-agent-teaser-close", type: "button", "aria-label": labels.dismiss || "Dismiss" });
  teaserClose.innerHTML = "&#10005;";
  var teaser = el("div", { id: "spotler-agent-teaser", role: "status" }, [teaserClose, teaserText]);
  teaser.hidden = true;
  if (region.id === "nl") teaser.className = "nl";

  document.body.appendChild(panel);
  document.body.appendChild(teaser);
  document.body.appendChild(pill);

  /* ---- sizing ---- */
  function syncPanelWidth() {
    var w = window.innerWidth >= 1600 ? SETTINGS.PANEL_WIDTH_WIDE : SETTINGS.PANEL_WIDTH;
    setVar("--spotler-agent-w", w + "px");
  }
  function syncBannerHeight() {
    var bar = document.querySelector(".top-header-container");
    if (bar) {
      var h = bar.offsetHeight;
      if (h >= 24 && h <= 64) setVar("--spotler-banner-h", h + "px");
    }
    var link = document.querySelector(".top-header-container a");
    if (link) {
      var cs = getComputedStyle(link);
      title.style.fontSize = cs.fontSize;
      title.style.fontWeight = cs.fontWeight;
      title.style.fontFamily = cs.fontFamily;
    }
  }
  syncPanelWidth();
  syncBannerHeight();
  var rt;
  window.addEventListener("resize", function () {
    syncPanelWidth();
    clearTimeout(rt); rt = setTimeout(syncBannerHeight, 150);
  });
  window.addEventListener("load", syncBannerHeight);
  setTimeout(syncBannerHeight, 1500);

  function isDesktop() { return window.innerWidth >= SETTINGS.DESKTOP_MIN_WIDTH; }

  /* ---- header fit ----
     When the panel squeezes the page, the site header keeps its wide-screen
     layout and, on smaller screens, the CTA and region switcher slid under
     the panel. Measure the squeezed header and make room step by step,
     stopping as soon as it fits:
       1  hide "Success stories" (also reachable via Resources)
       2  smaller banner: smaller logo, tighter side padding
       3  menu text 15px     4  menu text 14px
     Wide screens need none of this and keep the header exactly as it is. */
  var FIT_LEVELS = 4;
  function navLabel(li) {
    var a = li.querySelector(":scope > a, :scope > span, :scope > button, :scope > div > a");
    return trim(a ? a.textContent : (li.firstChild && li.firstChild.textContent) || "");
  }
  // The menu item hidden first when the squeezed header doesn't fit.
  function markFirstOut(box) {
    var nav = box.querySelector(".main-nav");
    if (!nav || nav.querySelector(".mia-drop")) return;
    var items = nav.children, pick = null;
    for (var i = 0; i < items.length; i++) {
      if (/^(success stories|succesverhalen|klantverhalen|kundengeschichten|kundenstories)/i.test(navLabel(items[i]))) { pick = items[i]; break; }
    }
    if (pick) pick.classList.add("mia-drop");
  }
  // Doesn't fit = the logo is cut off on the left, the last menu item runs
  // into the buttons, or the CTA / region switcher reach the panel (12px
  // clear, for the panel's shadow).
  function headerOverflows(hdr, box) {
    var hr = hdr.getBoundingClientRect();
    var limit = hr.right - 12;
    var logo = box.querySelector(".logo-wrapper img, .logo-wrapper svg");
    if (logo && logo.getBoundingClientRect().width && logo.getBoundingClientRect().left < hr.left + 4) return true;
    var buttons = box.querySelector(".header-buttons") || box.querySelector(".header-buttons-box");
    var lis = box.querySelectorAll(".main-nav > li"), last = null;
    for (var i = 0; i < lis.length; i++) if (lis[i].offsetParent !== null) last = lis[i];
    if (last && buttons && last.getBoundingClientRect().right > buttons.getBoundingClientRect().left - 12) return true;
    var edges = box.querySelectorAll(".header-buttons, .header-btn-wrap, .header-btn-wrap > *, .main-switcher-box");
    for (var j = 0; j < edges.length; j++) {
      var r = edges[j].getBoundingClientRect();
      if (r.width && r.right > limit) return true;
    }
    return false;
  }
  function fitHeader() {
    var body = document.body;
    for (var i = 1; i <= FIT_LEVELS; i++) body.classList.remove("mia-fit-" + i);
    if (!panel.classList.contains("open")) return;
    var hdr = document.getElementById("header");
    var box = hdr && hdr.querySelector(".header-box");
    if (!box) return;
    markFirstOut(box);
    var prev = hdr.style.transition;
    hdr.style.transition = "none";               // measure the final width, not mid-slide
    void hdr.offsetWidth;
    for (var lvl = 1; lvl <= FIT_LEVELS && headerOverflows(hdr, box); lvl++) {
      body.classList.add("mia-fit-" + lvl);
      void hdr.offsetWidth;
    }
    hdr.style.transition = prev;
    fitBar();
    nudgeDropdowns();
  }
  // The top bar wraps when its links sit on more than one row.
  function barWraps(ul) {
    var lis = ul.children;
    if (lis.length < 2) return false;
    return lis[lis.length - 1].getBoundingClientRect().top > lis[0].getBoundingClientRect().top + 2;
  }
  function fitBar() {
    var body = document.body;
    body.classList.remove("mia-bar-fit");
    body.classList.remove("mia-bar-tight");
    if (!panel.classList.contains("open")) return;
    var nav = document.querySelector(".top-header-container .top-nav-container");
    var ul = nav && nav.querySelector(".top-nav");
    if (!ul || !barWraps(ul)) return;
    // Width the links need on one row, and the room the bar has for them.
    var lis = ul.children, need = 0;
    var gap = parseFloat(getComputedStyle(ul).columnGap) || 0;
    for (var i = 0; i < lis.length; i++) need += lis[i].getBoundingClientRect().width;
    need += gap * (lis.length - 1);
    var col = nav.parentElement, cs = getComputedStyle(col);
    var room = col.getBoundingClientRect().width - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
    setVar("--mia-bar-mr", Math.max(16, Math.floor(room - need - 4)) + "px");
    body.classList.add("mia-bar-fit");
    if (barWraps(ul)) body.classList.add("mia-bar-tight");
    syncBannerHeight();
  }

  var fitTimer;
  function refit() { clearTimeout(fitTimer); fitTimer = setTimeout(fitHeader, 120); }
  window.addEventListener("resize", refit);
  window.addEventListener("load", refit);
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit); } catch (e) {}

  /* ---- header dropdowns ---- */
  // The theme places its dropdowns (the region switcher above all) for the
  // full window, so beside the panel they open half underneath it. Any
  // popup that crosses the header's right edge is shifted left until it
  // clears it. `translate` is used so the theme's own `transform` is left
  // alone. The shift is worked out from where the popup ends up once its
  // open animation is done, and applied before the first frame is painted
  // (MutationObserver / requestAnimationFrame), so it opens in place
  // rather than jumping sideways.
  var nudged = [], headerObserver = null, nudgeFrame = 0;
  function unnudge() {
    for (var i = 0; i < nudged.length; i++) { nudged[i].style.removeProperty("translate"); nudged[i].__miaShift = 0; }
    nudged = [];
  }
  // Bounding box with the element's running animations/transitions jumped
  // to their end, then put back (same task, so nothing is painted).
  function settledRect(n) {

    try { anims = n.getAnimations ? n.getAnimations() : []; } catch (e) {}
    for (var i = 0; i < anims.length; i++) {
      times.push(anims[i].currentTime);

        var end = anims[i].effect.getComputedTiming().endTime;
        if (isFinite(end)) anims[i].currentTime = end;
      } catch (e) {}

    for (var j = 0; j < anims.length; j++) try { anims[j].currentTime = times[j]; } catch (e) {}

  }
  function watchHeader(hdr) {
    if (headerObserver || !window.MutationObserver) return;
    headerObserver = new MutationObserver(function () {
      if (panel.classList.contains("open")) nudgeDropdowns();

      attributeFilter: ["class", "style", "hidden", "open", "aria-expanded"] });
  }
  function nudgeDropdowns() {
